{{- if .Values.nodePrep.enabled }}
{{- if not .Values.storage.models.pvcName }}{{- fail "values: storage.models.pvcName is required when nodePrep.enabled (local-storage renders PVs/PVCs)" }}{{- end }}
{{- if not .Values.storage.cache.pvcName }}{{- fail "values: storage.cache.pvcName is required when nodePrep.enabled (local-storage renders PVs/PVCs)" }}{{- end }}
{{- if and .Values.lmcache.enabled .Values.lmcache.l2.enabled (not .Values.storage.l2.pvcName) }}{{- fail "values: storage.l2.pvcName is required when lmcache.l2.enabled" }}{{- end }}
{{- $storageClass := include "md.storageClassName" . }}
# Static local PVs + pre-created PVCs for the LLMInferenceService.
#
# The hostPathBase/{models,cache} paths exist on EVERY node listed in
# nodes.hostnames (created and kept mounted by the node-prep DaemonSet),
# each node holding its own copy of the data. One `local` PV whose
# nodeAffinity lists all nodes lets every pod mount its own node's copy
# through ONE claim name -- the pattern the LLMInferenceService needs,
# since the controller creates a single Deployment (one pod template, one
# claimName) even with replicas > 1, and LVMS/topolvm PVCs cannot cross
# nodes (RWO + volume node affinity).
#
# Pre-created with volumeName pinned: bound immediately, never pruned by
# ReplicaSet churn (unlike generic ephemeral volumeClaimTemplates).
#
# NOTE: PVs are cluster-scoped and named exactly as the PVCs; on
# `helm uninstall` they are retained (reclaimPolicy Retain) -- re-installing
# rebinds them. The StorageClass defaults to <fullname>-local-static: give
# every chart its OWN class (never share an ArgoCD-managed object with
# another chart's app), or set storage.className to reuse an existing
# cluster-side class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $storageClass }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.storage.models.pvcName }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.models.pvSize }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  local:
    path: {{ .Values.nodePrep.hostPathBase }}/{{ .Values.storage.models.subdir }}
  {{- include "md.pvNodeAffinity" . | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.models.pvcName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  storageClassName: {{ $storageClass }}
  volumeName: {{ .Values.storage.models.pvcName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.models.pvSize }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.storage.cache.pvcName }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.cache.pvSize }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  local:
    path: {{ .Values.nodePrep.hostPathBase }}/{{ .Values.storage.cache.subdir }}
  {{- include "md.pvNodeAffinity" . | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.cache.pvcName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  storageClassName: {{ $storageClass }}
  volumeName: {{ .Values.storage.cache.pvcName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.cache.pvSize }}
{{- if and .Values.lmcache.enabled .Values.lmcache.l2.enabled }}
---
# L2 disk tier for the LMCache engine: same multi-node local-PV pattern, so
# the engine DaemonSet's pods (one per GPU node) each mount their own
# node's <hostPathBase>/lmcache-l2 through this one claim. Not pod-owned --
# survives engine pod recreation; node-prep creates/keeps mounted the LV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.storage.l2.pvcName }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.l2.pvSize }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  local:
    path: {{ .Values.nodePrep.hostPathBase }}/{{ .Values.storage.l2.subdir }}
  {{- include "md.pvNodeAffinity" . | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.l2.pvcName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  storageClassName: {{ $storageClass }}
  volumeName: {{ .Values.storage.l2.pvcName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.l2.pvSize }}
{{- end }}
{{- end }}
