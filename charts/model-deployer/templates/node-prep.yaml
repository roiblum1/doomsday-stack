{{- if .Values.nodePrep.enabled }}
{{- if not .Values.nodePrep.image }}{{- fail "values: nodePrep.image is required when nodePrep.enabled" }}{{- end }}
{{- if and .Values.nodePrep.devices (not .Values.nodePrep.vg) }}{{- fail "values: nodePrep.vg is required when nodePrep.devices is set" }}{{- end }}
# Node prep for GPU-node local storage.
#
# Why a DaemonSet: this cluster has no manageable MCO/MachineConfig
# (HyperShift hosted), so a systemd mount unit is not an option. Instead a
# privileged DaemonSet runs `nsenter -t 1` to prepare and KEEP MOUNTED the
# manual LVs carved from the VG's free space (LVMS/topolvm uses thick LVs
# and only manages its own, so a manually created LV is left alone; VG
# free just shrinks).
#
# The same path exists on EVERY node in nodes.hostnames, each holding its
# own copy of the data. A static `local` PV (local-storage.yaml) with
# nodeAffinity for all nodes then exposes them through ONE pre-created PVC
# name so the single Deployment the LLMInferenceService controller creates
# can mount it from any node.
#
# The DaemonSet is idempotent and re-runs on node reboot: mounts land in
# the HOST mount namespace via nsenter (they survive container exit), and
# the loop re-checks periodically. SELinux: dirs are labeled
# container_file_t so restricted pods (the model pull Jobs) can write into
# them; files created by containers inherit the label.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "md.fullname" . }}-node-prep
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-privileged-scc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - privileged
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "md.fullname" . }}-node-prep-use-privileged-scc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-privileged-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "md.fullname" . }}-node-prep
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "md.fullname" . }}-node-prep
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
    app: {{ include "md.fullname" . }}-node-prep
spec:
  selector:
    matchLabels:
      app: {{ include "md.fullname" . }}-node-prep
  template:
    metadata:
      labels:
        {{- include "md.labels" . | nindent 8 }}
        app: {{ include "md.fullname" . }}-node-prep
    spec:
      serviceAccountName: {{ include "md.fullname" . }}-node-prep
      hostPID: true
      nodeSelector:
        nvidia.com/gpu.product: {{ .Values.nodes.gpuProduct }}
      terminationGracePeriodSeconds: 5
      containers:
        - name: node-prep
          image: {{ .Values.nodePrep.image }}
          imagePullPolicy: {{ .Values.nodePrep.imagePullPolicy }}
          # nsenter into PID 1's mount namespace so lvcreate/mkfs/mount/chcon
          # act on the HOST and persist beyond this container's lifetime.
          command:
            - nsenter
            - -t
            - "1"
            - -m
            - -u
            - -i
            - -n
            - --
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              # nsenter keeps the container's env; host LVM tools live in /usr/sbin.
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              VG={{ .Values.nodePrep.vg }}
              BASE={{ .Values.nodePrep.hostPathBase }}
              LOOP={{ .Values.nodePrep.loopIntervalSeconds }}
{{- if .Values.nodePrep.devices }}

              # Create the volume group if this node does not have it yet
              # (fresh node with a blank data disk -- set nodePrep.devices;
              # nodes whose VG comes from the day-1 /dev/md/lvmdata RAID
              # leave it empty). Safe by refusal: pvcreate without --force
              # rejects devices with filesystem or partition signatures,
              # and the script additionally skips any disk lsblk reports as
              # non-blank. Non-fatal on failure: the loop below retries
              # every ${LOOP}s.
              ensure_vg() {
                if vgs "${VG}" >/dev/null 2>&1; then
                  return 0
                fi
                echo "[node-prep] volume group ${VG} missing, creating from: {{ join " " .Values.nodePrep.devices }}"
                local devs=()
                for dev in {{ join " " .Values.nodePrep.devices }}; do
                  if pvs "${dev}" >/dev/null 2>&1; then
                    echo "[node-prep] ${dev} already a PV"
                  elif lsblk -rno PARTUUID,FSTYPE "${dev}" 2>/dev/null | tr -d '[:space:]' | grep -q .; then
                    # (a blank disk still prints one whitespace-only row for
                    # the disk itself; strip ALL whitespace so only real
                    # partition/filesystem signatures match)
                    echo "[node-prep] REFUSING to use ${dev}: has partitions/filesystem (not blank)"
                    return 0
                  else
                    echo "[node-prep] pvcreate ${dev}"
                    pvcreate --yes "${dev}" || return 0
                  fi
                  devs+=("${dev}")
                done
                if [ ${#devs[@]} -eq 0 ]; then
                  return 0
                fi
                vgcreate --yes "${VG}" "${devs[@]}" || return 0
                echo "[node-prep] created ${VG}"
              }
{{- end }}

              # Ensure an LV exists, is mounted, and -- critically -- is
              # mounted at BOTH path resolutions the container runtime may
              # use for local PVs. On RHCOS /var is a bind of
              # <rootfs>/ostree/deploy/rhcos/var, so the same directory is
              # reachable via /var/mnt/... AND via the ostree path. Bind
              # mounts are snapshots: if the runtime binds through the
              # ostree path while the LV is only mounted at the /var path
              # (or vice versa), the pod gets the underlying boot-disk
              # directory and silently writes cache data to the root fs.
              # Mounting the LV at both paths makes every resolution land
              # on the LV. fstab entries make systemd mount both at boot,
              # before the kubelet starts pods (same protection across
              # node reboots).
              ensure_fstab() {
                local dev=$1 mp=$2
                if ! grep -qE "^${dev}[[:space:]]+${mp}[[:space:]]" /etc/fstab; then
                  echo "${dev}  ${mp}  xfs  defaults,nofail,x-systemd.device-timeout=10s  0 0" >> /etc/fstab
                  echo "[node-prep] fstab entry added: ${dev} -> ${mp}"
                fi
              }
              ensure_lv() {
                local name=$1 size=$2 subdir=$3
                local dev="/dev/${VG}/${name}" mp="${BASE}/${subdir}"
                if ! lvs "${VG}/${name}" >/dev/null 2>&1; then
                  echo "[node-prep] creating LV ${VG}/${name} (${size})"
                  # Non-fatal on failure (e.g. vg1 briefly out of space while
                  # an old volume is being recycled): the loop below retries
                  # every ${LOOP}s instead of crash-looping the pod.
                  if ! lvcreate -y -L "${size}" -n "${name}" "${VG}"; then
                    echo "[node-prep] lvcreate ${name} deferred (will retry): $(vgs --noheadings -o vg_free --units g ${VG} 2>/dev/null || echo '?') free"
                    return 0
                  fi
                fi
                lvchange -ay "${VG}/${name}" 2>/dev/null || true
                mkdir -p "${mp}"
                if ! mountpoint -q "${mp}"; then
                  if ! blkid "${dev}" >/dev/null 2>&1; then
                    echo "[node-prep] mkfs.xfs ${dev}"
                    mkfs.xfs "${dev}"
                  fi
                  mount "${dev}" "${mp}"
                  # Full relabel once, right after first mount (empty fs).
                  chcon -R -t container_file_t ${BASE}
                fi
                ensure_fstab "${dev}" "${mp}"
                # Second mount at the canonical (root-mount) path: same
                # directory content, independent mount instance. Harmless
                # when /var is not a bind (canon == mp, skipped).
                local var_root canon=""
                var_root="$(findmnt -n -o FSROOT /var 2>/dev/null || true)"
                case "${BASE}" in
                  /var/*) [ -n "${var_root}" ] && [ "${var_root}" != "/" ] && canon="${var_root}${BASE#/var}/${subdir}" ;;
                esac
                if [ -n "${canon}" ] && [ "${canon}" != "${mp}" ]; then
                  mkdir -p "${canon}" 2>/dev/null || true
                  if ! mountpoint -q "${canon}"; then
                    if mount "${dev}" "${canon}" 2>/dev/null; then
                      echo "[node-prep] dual mount OK: ${name} also at ${canon}"
                    else
                      echo "[node-prep] WARN: dual mount failed: ${name} -> ${canon} (will retry)"
                    fi
                  fi
                  ensure_fstab "${dev}" "${canon}"
                fi
                chmod 1777 "${mp}"
                chcon -t container_file_t "${mp}" >/dev/null 2>&1 || true
              }

              # (flashinfer cubin seeding needs the image's dist-packages,
              # which are NOT visible in this HOST mount namespace; the
              # cubin-src container below exposes them via /proc/<pid>/root.)

              # Seed flashinfer's trtllm-gen cubins from the cubin-src
              # container's rootfs (same image: pick a nodePrep.image that
              # bundles the flashinfer_cubin dist package -- serving images
              # shipping plain flashinfer have NO bundled cubins and fetch
              # fmha/trtllm-gen cubins from edge.urm.nvidia.com at boot --
              # unreachable air-gapped, the vLLM pod crash-loops on "Failed
              # to get checksums.txt"). flashinfer checks FLASHINFER_CUBIN_DIR (=
              # FLASHINFER_WORKSPACE_BASE + .cache/flashinfer/cubins inside
              # the vLLM pods, i.e. this LV) BEFORE any download and
              # sha256-verifies each file, so a plain copy satisfies it.
              # Runs AFTER ensure_lv mounted the LV (we see it through the
              # host mount table, so no bind-mount staleness). Idempotent.
              # NOTE: the cubin package is arch-tagged; if the target arch's
              # (e.g. sm89) cubins are absent from this package, seeding is
              # a no-op for them and any boot failure must be handled by
              # pinning a donor image that bundles them.
              seed_flashinfer_cubins() {
                # ONLY seed onto the mounted cache LV: without this check
                # a deferred lvcreate would silently write ~6G of cubins to
                # the boot disk (later shadowed by the LV mount, invisible
                # and undeletable through normal paths).
                if ! mountpoint -q "${BASE}/cache"; then
                  echo "[node-prep] cache LV not mounted yet, cubin seeding deferred"
                  return 0
                fi
                local dst_root="${BASE}/cache/flashinfer/.cache/flashinfer/cubins"
                local pid
                # Anchored: this script's own cmdline contains the marker
                # text (function body), and pgrep -f scans full cmdlines --
                # an unanchored pattern matched ourselves (host root, no
                # dist-packages). ^ pins it to the sidecar's argv0.
                pid=$(pgrep -f '{{ .Values.nodePrep.cubinSrc.pgrepPattern }}' | head -1 || true)
                if [ -z "${pid}" ]; then
                  echo "[node-prep] cubin-src container not up yet, will retry"
                  return 0
                fi
                local src="/proc/${pid}/root{{ .Values.nodePrep.cubinSrc.distPackagesPath }}"
                if [ ! -d "${src}" ]; then
                  echo "[node-prep] cubin-src image has no flashinfer_cubin package"
                  return 0
                fi
                for hashdir in "${src}"/*; do
                  [ -d "${hashdir}" ] || continue
                  local hash=$(basename "${hashdir}")
                  if [ -e "${dst_root}/${hash}/fmha/trtllm-gen/checksums.txt" ]; then
                    continue
                  fi
                  echo "[node-prep] seeding flashinfer cubins ${hash} ($(du -sh ${hashdir} | cut -f1))"
                  mkdir -p "${dst_root}/${hash}"
                  cp -a "${hashdir}/." "${dst_root}/${hash}/"
                  chmod -R a+rX "${dst_root}/${hash}"
                  echo "[node-prep] seeded ${hash}"
                done
              }

              while true; do
{{- if .Values.nodePrep.devices }}
                ensure_vg
{{- end }}
                ensure_lv {{ .Values.storage.models.lvName }} {{ .Values.storage.models.lvSize }} {{ .Values.storage.models.subdir }}
                ensure_lv {{ .Values.storage.cache.lvName }} {{ .Values.storage.cache.lvSize }} {{ .Values.storage.cache.subdir }}
                ensure_lv {{ .Values.storage.l2.lvName }} {{ .Values.storage.l2.lvSize }} {{ .Values.storage.l2.subdir }}
                seed_flashinfer_cubins
                echo "[node-prep] $(date -Is) OK: $(mount | grep ${BASE} | awk '{print $1"->"$3}' | tr '\n' ' ')"
                sleep ${LOOP}
              done
          resources:
            {{- toYaml .Values.nodePrep.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
        # Rootfs DONOR for seed_flashinfer_cubins above: this container keeps
        # a normal container mount namespace (the nsenter'd script lost
        # it), and hostPID: true makes its PID visible to that script, which
        # reads the image's flashinfer_cubin package through
        # /proc/<pid>/root. The argv0 marker is what the script pgreps for.
        # No volumes: a hostPath of the LV would go stale across node
        # reboots (the bind is created before node-prep mounts the LV).
        - name: cubin-src
          image: {{ .Values.nodePrep.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - exec -a lmcache-cubin-src sleep infinity
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 100m, memory: 256Mi}
{{- end }}
