{{- if .Values.serviceAccount.name }}
# Service account for the model pull jobs and the vLLM serving pods. The
# S3 secret link is how the KServe controller finds the
# storage-initializer credentials for s3:// model URIs (it reads every
# secret linked to the workload SA and injects the AWS_* env from the one
# carrying AWS_SECRET_ACCESS_KEY); the pull jobs (PVC-based models) read
# the same secret directly. It must also keep the EPP's SA pinned (router
# template) to avoid the OCM dockercfg-adoption fight.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
{{- with .Values.s3.secretName }}
secrets:
  - name: {{ . }}
{{- end }}
{{- end }}
