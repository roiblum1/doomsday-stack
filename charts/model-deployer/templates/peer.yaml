{{- $name := include "md.name" . -}}
{{- $parent := dict "group" "gateway.networking.k8s.io" "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.peerListener -}}
# The only way to the model: from a site's entry route (aigw-ui's
# fleet-<model>, which has checked the key and counted the request) over
# mutual TLS to this listener, then the scheduler, then vLLM. Nothing is
# counted here.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ $name }}-peer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  parentRefs:
    # DO NOT REMOVE sectionName: without it the route is also on the
    # listener clients reach, where it skips keys and quotas.
    - {{- toYaml $parent | nindent 6 }}
  rules:
    # Exact: aigw-ui finds the model on this site by this match; it does not
    # read a regular expression.
    - name: serve
      matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .Values.model.name | quote }}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ include "md.pool" . }}
      timeouts:
        request: {{ .Values.peer.requestTimeout }}
      modelsOwnedBy: {{ .Release.Namespace }}
---
# What aigw-ui's health checks ask: GET /healthz/<model.name>. Straight to
# vLLM, not through the scheduler or the shed limit: a busy site must still
# answer, or a full site would be taken for a dead one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  parentRefs:
    - {{- toYaml $parent | nindent 6 }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz/{{ .Values.model.name }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ $name }}-kserve-workload-svc
          port: 8000
---
# The HTTPRoute the gateway generates from the AIGatewayRoute has its name.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}-peer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}-peer
  {{- with .Values.peer.maxParallelRequests }}
  circuitBreaker:
    maxParallelRequests: {{ . }}
    maxPendingRequests: {{ . }}
    maxConnections: 100000
  {{- end }}
  timeout:
    http:
      requestTimeout: {{ .Values.peer.requestTimeout }}
---
# A health check that meets a connection vLLM is closing gets 503, and Envoy
# takes the endpoint out on one such answer. It is tried again on a new
# connection instead.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}-health
  retry:
    numRetries: {{ .Values.peer.healthRetries }}
    retryOn:
      triggers: ["reset", "connect-failure"]
