{{- include "md.validate" . -}}
{{- $name := include "md.name" . -}}
{{- $s := .Values.serving -}}
{{- $fc := .Values.scheduler.flowControl -}}
{{- $w := .Values.scheduler.weights -}}
{{- $ranks := int $s.dataParallel.ranks -}}
{{- $gpus := int $s.gpus -}}
# Merged by KServe onto its template preset kserve-config-llm-template, which
# runs `vllm serve /mnt/models --served-model-name <model.name> --port 8000
# ... "$@"` through bash eval: the arguments below are those "$@".
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "md.labels" . | nindent 4 }}
  annotations:
    # What aigw-ui reads to weigh, label and price this site of the model.
    aigw-ui.io/capacity-per-instance: {{ .Values.model.capacityPerInstance | toString | quote }}
    {{- with .Values.model.revision }}
    aigw-ui.io/model-revision: {{ . | toString | quote }}
    {{- end }}
    {{- with .Values.model.maxModelLen }}
    aigw-ui.io/max-model-len: {{ . | toString | quote }}
    {{- end }}
    {{- with .Values.model.marketId }}
    aigw-ui.io/market-id: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ $s.replicas }}
  model:
    name: {{ .Values.model.name | quote }}
    uri: {{ include "md.uri" . | quote }}
  {{- if gt (int $s.tensorParallel) 0 }}
  # KServe adds --tensor-parallel-size from this field.
  parallelism:
    tensor: {{ int $s.tensorParallel }}
  {{- end }}
  {{- $rollout := $s.rollout }}
  {{- if and (not $rollout) (gt $gpus 0) }}
  {{- /* No free GPUs for a surge pod: a surge would wait forever. */}}
  {{- $rollout = dict "maxSurge" 0 "maxUnavailable" 1 }}
  {{- end }}
  {{- with $s.kvCacheOffloading }}
  # KServe renders vLLM's OffloadingConnector from this: KV blocks that leave
  # the GPU are kept in host memory (/dev/shm, so size serving.shmSize).
  kvCacheOffloading:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $rollout }}
  rolloutStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  router:
    # KServe reports the service ready only when a route of its own is
    # accepted by the gateway, so its route stays, on the peer listener,
    # where no client reaches it.
    route: {}
    gateway:
      refs:
        - name: {{ .Values.gateway.name }}
          namespace: {{ .Values.gateway.namespace }}
          sectionName: {{ .Values.gateway.peerListener }}
    scheduler:
      {{- if gt $ranks 1 }}
      # One endpoint per data-parallel rank: the scheduler picks a rank, and
      # aigw-ui's capacity measurement loads every port listed here.
      pool:
        spec:
          appProtocol: http
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: {{ $name }}-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            {{- range $i := until $ranks }}
            - number: {{ add 8000 $i }}
            {{- end }}
      {{- end }}
      {{- if .Values.scheduler.config }}
      config:
        inline:
          {{- toYaml .Values.scheduler.config | nindent 10 }}
      {{- else if or $fc.enabled .Values.scheduler.custom }}
      config:
        inline:
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          {{- if $fc.enabled }}
          featureGates: [flowControl]
          {{- end }}
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: prefix-cache-scorer
            - type: no-hit-lru-scorer
            - type: max-score-picker
            {{- if $fc.enabled }}
            - type: concurrency-detector
              parameters:
                maxConcurrency: {{ $fc.maxConcurrency }}
            {{- with $fc.fairnessPolicy }}
            - type: {{ . }}
            - type: fcfs-ordering-policy
            {{- end }}
            {{- end }}
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: {{ $w.queue }}
                - pluginRef: kv-cache-utilization-scorer
                  weight: {{ $w.kvCache }}
                - pluginRef: prefix-cache-scorer
                  weight: {{ $w.prefix }}
                - pluginRef: no-hit-lru-scorer
                  weight: {{ $w.noHitLru }}
                - pluginRef: max-score-picker
          {{- if $fc.enabled }}
          flowControl:
            saturationDetector:
              pluginRef: concurrency-detector
            defaultRequestTTL: {{ $fc.requestTTL }}
            {{- with $fc.fairnessPolicy }}
            defaultPriorityBand:
              fairnessPolicyRef: {{ . }}
              orderingPolicyRef: fcfs-ordering-policy
            {{- end }}
            {{- with $fc.negativeBandMaxRequests }}
            defaultNegativePriorityBand:
              maxRequests: {{ . | toString | quote }}
              {{- /* A negative band that names no policy runs the
                     scheduler's default (oldest first), not
                     defaultPriorityBand's (llm-d router v0.11.0). */}}
              {{- with $fc.fairnessPolicy }}
              fairnessPolicyRef: {{ . }}
              orderingPolicyRef: fcfs-ordering-policy
              {{- end }}
            {{- end }}
            enableEviction: {{ $fc.enableEviction }}
          {{- end }}
      {{- end }}
  template:
    {{- with .Values.storage.s3.serviceAccountName }}
    serviceAccountName: {{ . }}
    {{- end }}
    {{- with $s.runtimeClassName }}
    runtimeClassName: {{ . }}
    {{- end }}
    {{- with $s.terminationGracePeriodSeconds }}
    terminationGracePeriodSeconds: {{ . }}
    {{- end }}
    {{- $nodeSelector := deepCopy ($s.nodeSelector | default dict) }}
    {{- with $s.gpuProduct }}
    {{- $_ := set $nodeSelector "nvidia.com/gpu.product" . }}
    {{- end }}
    {{- with $nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $s.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if and (regexMatch "^(hf|s3)://" .Values.model.uri) (not (include "md.cached" .)) .Values.storage.downloadHome }}
    initContainers:
      - name: storage-initializer
        env:
          - name: HOME
            value: {{ .Values.storage.downloadHome }}
          - name: HF_HOME
            value: {{ .Values.storage.downloadHome }}/hf
    {{- end }}
    containers:
      - name: main
        {{- with $s.image }}
        image: {{ . }}
        {{- end }}
        args:
          {{- include "md.args" . | nindent 10 }}
        env:
          {{- with $s.keepAliveSeconds }}
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: {{ . | toString | quote }}
          {{- end }}
          {{- range $k := keys ($s.env | default dict) | sortAlpha }}
          - name: {{ $k }}
            value: {{ index $s.env $k | toString | quote }}
          {{- end }}
        {{- $res := deepCopy ($s.resources | default dict) }}
        {{- if gt $gpus 0 }}
        {{- $req := deepCopy (get $res "requests" | default dict) }}
        {{- $lim := deepCopy (get $res "limits" | default dict) }}
        {{- $_ := set $req "nvidia.com/gpu" (toString $gpus) }}
        {{- $_ := set $lim "nvidia.com/gpu" (toString $gpus) }}
        {{- $_ := set $res "requests" $req }}
        {{- $_ := set $res "limits" $lim }}
        {{- end }}
        {{- with $res }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # Merged onto the preset's probes (/health on 8000): only the start
        # time changes, unless data parallel moves them to the supervisor,
        # which answers for every rank (/health while the process lives,
        # /readyz once all ranks serve).
        startupProbe:
          {{- if gt $ranks 1 }}
          httpGet:
            path: /health
            port: {{ int $s.dataParallel.supervisorPort }}
          {{- end }}
          periodSeconds: 10
          failureThreshold: {{ div (int $s.startupSeconds) 10 | max 1 }}
        {{- if gt $ranks 1 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ int $s.dataParallel.supervisorPort }}
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ int $s.dataParallel.supervisorPort }}
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 5
        {{- end }}
        {{- with $s.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- if or $s.shmSize $s.volumes }}
    volumes:
      {{- with $s.shmSize }}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ . }}
      {{- end }}
      {{- with $s.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
