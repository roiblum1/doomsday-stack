apiVersion: v2
name: model-deployer
description: >-
  One model on a serving site of an aigw-ui fleet: the LLMInferenceService
  (CPU, one GPU, tensor or data parallel), its scheduler, the peer-listener
  route the hub's entry route sends to, the health route, the request classes
  and, if asked, a PVC that holds the weights. A deployment is a values file;
  aigw-ui writes those files to git and Argo CD deploys them.
type: application
version: 0.1.0
appVersion: "kserve-0.21 / ai-gateway-1.2.0"
kubeVersion: ">=1.29.0-0"
