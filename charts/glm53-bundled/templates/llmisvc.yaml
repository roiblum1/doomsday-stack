# The serving workload: ONE LLMInferenceService, replicas = number of
# nodes (one pod per node, full node each), behind the llm-d router
# (EPP + InferencePool).
#
# Storage: model.uri pvc://<claim>/<subPath> references the pre-created
# PVC bound to a static `local` PV whose nodeAffinity lists ALL target
# nodes at the same host path (each node holds its own copy, see
# local-storage.yaml + node-prep.yaml). The controller mounts the claim
# read-only at /mnt/models and strips the storage-initializer.
#
# Parallelism: DP8 x EP8 intra-node over NVLink -- nothing crosses the
# node boundary; the EPP (InferencePool) picks the node per request, vLLM
# balances the ranks.
#
# rolloutStrategy maxSurge 0: the default surge pod would need free GPUs
# that don't exist -> rollout deadlock.
#
# Merged on the base preset kserve-config-llm-template which already runs
# `vllm serve /mnt/models --served-model-name ... --port 8000 ... "$@"`
# (bash eval) -> args must be single tokens (dotted keys, no JSON).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.llmisvc.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "glm53.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.llmisvc.replicas }}
  model:
    name: {{ .Values.model.name }}
    uri: {{ include "glm53.modelUri" . }}
  rolloutStrategy:
    maxSurge: {{ .Values.llmisvc.rolloutStrategy.maxSurge }}
    maxUnavailable: {{ .Values.llmisvc.rolloutStrategy.maxUnavailable }}
  {{- with .Values.llmisvc.kvCacheOffloading }}
  # Rendered by the controller into the vLLM launcher's KV_TRANSFER_ARGS
  # (OffloadingConnector, CPU tier in /dev/shm -- see values.yaml for the
  # sizing contract with volumes.dshmSize). Omitted entirely when unset.
  kvCacheOffloading:
    cpu: {{ .cpu }}
    {{- with .evictionPolicy }}
    evictionPolicy: {{ . }}
    {{- end }}
  {{- end }}
  router:
    # KServe's own HTTPRoute (path rules /<namespace>/<name>/... and
    # /publishers/...) attaches to the shared gateway's PEER listener only.
    # On the client listener it is a way to the model past aigw-ui's entry
    # route: nothing is counted against a quota there.
    gateway:
      refs:
        - name: {{ .Values.gateway.aiGateway.name }}
          namespace: {{ .Values.gateway.aiGateway.namespace }}
          {{- with .Values.gateway.aiGateway.kserveRouteListener }}
          # Without sectionName the route is on both listeners.
          sectionName: {{ . }}
          {{- end }}
    route: {}
    {{- $fc := .Values.llmisvc.flowControl | default (dict) }}
    {{- if not (has ($fc.fairnessPolicy | default "") (list "" "round-robin-fairness-policy")) }}
    {{- fail "llmisvc.flowControl.fairnessPolicy must be empty or round-robin-fairness-policy" }}
    {{- end }}
    {{- $sched := .Values.llmisvc.scheduler }}
    {{- if $fc.enabled }}
    {{- $sched = include "glm53.schedulerWithFlowControl" . | fromYaml }}
    {{- end }}
    {{- with $sched }}
    scheduler:
      # Pin the EPP to the chart's ServiceAccount instead of letting kserve
      # mint its own <name>-epp-sa. Unpinned, the controller deep-copies the
      # WORKLOAD SA into the epp-sa -- dragging along OpenShift's rotating
      # dockercfg secret (s3sa-dockercfg-*), which OCM then re-adopts onto
      # the copy, fighting the original SA's owner for it every few seconds.
      # With this set the controller uses s3sa directly ("Using existing
      # service account for scheduler", verified against the
      # llmisvc-controller v0.21.0-rc1 binary) and creates no child SA.
      template:
        serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- toYaml . | nindent 6 }}
    {{- end }}
  template:
    serviceAccountName: {{ .Values.serviceAccount.name }}
    runtimeClassName: {{ .Values.llmisvc.runtimeClassName }}
    schedulerName: {{ .Values.llmisvc.schedulerName }}
    terminationGracePeriodSeconds: {{ .Values.llmisvc.terminationGracePeriodSeconds }}
    nodeSelector:
      nvidia.com/gpu.product: {{ .Values.nodes.gpuProduct }}
    containers:
      - name: main
        image: {{ .Values.images.vllm }}
        imagePullPolicy: IfNotPresent
        args:
          {{- toYaml .Values.llmisvc.args | nindent 10 }}
        env:
          {{- range $key, $value := .Values.llmisvc.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- with $.Values.llmisvc.keepAliveSeconds }}
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: {{ . | quote }}
          {{- end }}
        resources:
          {{- toYaml .Values.llmisvc.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - IPC_LOCK
        # Probes hit the DP supervisor (multi-port external LB mode), which
        # serves aggregated child health: /health once engines initialize,
        # /readyz reflecting all per-rank API servers (see
        # vllm/entrypoints/launchers/dp_supervisor.py).
        startupProbe:
          httpGet:
            path: /health
            port: 8208
            scheme: HTTP
          periodSeconds: {{ .Values.llmisvc.probes.startup.periodSeconds }}
          failureThreshold: {{ .Values.llmisvc.probes.startup.failureThreshold }}
          timeoutSeconds: {{ .Values.llmisvc.probes.startup.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8208
            scheme: HTTP
          periodSeconds: {{ .Values.llmisvc.probes.readiness.periodSeconds }}
          failureThreshold: {{ .Values.llmisvc.probes.readiness.failureThreshold }}
          timeoutSeconds: {{ .Values.llmisvc.probes.readiness.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8208
            scheme: HTTP
          periodSeconds: {{ .Values.llmisvc.probes.liveness.periodSeconds }}
          failureThreshold: {{ .Values.llmisvc.probes.liveness.failureThreshold }}
          timeoutSeconds: {{ .Values.llmisvc.probes.liveness.timeoutSeconds }}
        volumeMounts:
          - mountPath: /cache
            name: compile-cache
          - mountPath: /dev/hugepages
            name: hugepages
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.llmisvc.volumes.dshmSize }}
      - name: hugepages
        emptyDir:
          medium: HugePages
          sizeLimit: {{ .Values.llmisvc.volumes.hugepagesSize }}
      - name: compile-cache
        persistentVolumeClaim:
          claimName: {{ .Values.storage.cache.pvcName }}
