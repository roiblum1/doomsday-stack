# Service account for the model pull jobs and the vLLM serving pods.
# The S3 secret is linked so pods can read model weights from object
# storage when needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "glm53.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.s3.secretName }}
