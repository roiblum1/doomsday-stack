{{- if .Values.aigatewayRoute.enabled }}
# OFF by default (aigatewayRoute.enabled: false) since the model is served by
# templates/peer.yaml. What this file renders sits on the client listener
# and skips aigw-ui's entry route. Kept for the migration and as a way
# back; the comments below describe the old path.
#
# Agent Router (Envoy AI Gateway) route on the shared gateway (VIP .145):
# header-based model routing. The extproc derives x-ai-eg-model from the
# request body's "model" field on every registered endpoint (both
# /v1/chat/completions and /anthropic/v1/messages), so the SAME model name
# selects the same rule regardless of client protocol.
#
# Rule map (first match wins, all Exact unless noted):
#   glm-5.3                          -> native Anthropic backend (Claude Code
#                                      path: thinking + count_tokens work,
#                                      zero translation)
#   publishers/llm-glm53/.../glm-5.3 -> InferencePool/EPP (OpenAI protocol;
#                                      vLLM natively serves this model id,
#                                      so no rewrite is needed)
#   ^claude-.*$ (regex)              -> native Anthropic backend + model
#                                      rewrite (safety net for Claude Code
#                                      clients without ANTHROPIC_MODEL
#                                      remapping; without it they 404)
#   anything else                   -> auto-generated route-not-found 404
#
# Constraints honored here:
# - Only ONE InferencePool per rule; cannot mix with AIServiceBackend.
# - modelNameOverride only applies to AIServiceBackend refs (ignored for
#   InferencePool) -- the claude-* alias uses it to rewrite to glm-5.3.
# - Default request timeout 60s kills long reasoning -> raised here.
# - Cross-namespace parentRef: the shared gateway's listener allows routes
#   from all namespaces.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ .Values.aigatewayRoute.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "glm53.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.aiGateway.name }}
      namespace: {{ .Values.gateway.aiGateway.namespace }}
      sectionName: {{ .Values.gateway.aiGateway.listener }}
  rules:
    # --- Claude Code / Anthropic protocol: native passthrough ---------------
    {{- if .Values.anthropicBackend.enabled }}
    - name: anthropic-native
      matches:
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.model.name }}
      backendRefs:
        # group/kind omitted: defaults to AIServiceBackend
        # (aigateway.envoyproxy.io) -- the CRD only accepts an explicit
        # group for InferencePool refs.
        - name: {{ .Values.anthropicBackend.name }}
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
    {{- else }}
    # (anthropicBackend disabled: glm-5.3 goes to the EPP/InferencePool as
    # before, with the extproc translation and its known v1.1.0 gaps)
    - matches:
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.model.name }}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ .Values.llmisvc.name }}-inference-pool
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
    {{- end }}
    # --- OpenAI protocol via EPP/InferencePool --------------------------------
    # vLLM natively serves this second model id, so no model rewrite is
    # needed on this rule. OpenAI-format clients MUST use this name while
    # anthropicBackend is enabled (glm-5.3 routes them to the Anthropic
    # backend with OpenAI<->Anthropic translation in between).
    - name: openai-epp
      matches:
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.aigatewayRoute.openaiModel }}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ .Values.llmisvc.name }}-inference-pool
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
    # --- Claude Code clients not remapping the model name --------------------
    {{- if and .Values.anthropicBackend.enabled .Values.aigatewayRoute.claudeAlias.enabled }}
    - name: claude-alias
      matches:
        - headers:
            - type: RegularExpression
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.aigatewayRoute.claudeAlias.regex | quote }}
      backendRefs:
        # group/kind omitted: defaults to AIServiceBackend (see above)
        - name: {{ .Values.anthropicBackend.name }}
          modelNameOverride: {{ .Values.model.name }}
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
    {{- end }}
  llmRequestCosts:
    - {metadataKey: llm_input_token, type: InputToken}
    - {metadataKey: llm_output_token, type: OutputToken}
    - {metadataKey: llm_reasoning_token, type: ReasoningToken}
    - {metadataKey: llm_total_token, type: TotalToken}
{{- end }}
