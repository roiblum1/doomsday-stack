{{- if .Values.s3.create }}
# OPTIONAL: create the S3 credentials secret from values. Prefer the
# default (create: false) and provision the secret out-of-band instead --
# real credentials must never be committed to values files.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "glm53.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.keys.accessKeyId }}: {{ .Values.s3.accessKeyId | quote }}
  {{ .Values.s3.keys.secretAccessKey }}: {{ .Values.s3.secretAccessKey | quote }}
  {{ .Values.s3.keys.endpoint }}: {{ .Values.s3.endpoint | quote }}
  {{ .Values.s3.keys.region }}: {{ .Values.s3.region | quote }}
{{- end }}
