{{- if .Values.s3.create }}
{{- if not .Values.s3.secretName }}{{- fail "values: s3.secretName is required when s3.create" }}{{- end }}
# OPTIONAL: create the S3 credentials secret from values. Prefer the
# default (create: false) and provision the secret out-of-band instead --
# real credentials must never be committed to values files.
{{- if eq .Values.s3.shape "kserve" }}
# Shape required by the KServe controller (credentials/s3/s3_secret.go):
#   - data keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY -> injected as
#     credential env into the storage-initializer
#   - annotation serving.kserve.io/s3-endpoint -> AWS_ENDPOINT_URL. The
#     http:// prefix matters: it sets S3_USE_HTTPS=0 (the FlashGrid
#     endpoints are plain HTTP).
#   - annotation serving.kserve.io/s3-region -> AWS_REGION
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genericmodel.labels" . | nindent 4 }}
  annotations:
    serving.kserve.io/s3-endpoint: {{ .Values.s3.endpoint | quote }}
    serving.kserve.io/s3-region: {{ .Values.s3.region | quote }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
{{- else }}
# Shape the s5cmd pull jobs read: data key NAMES from s3.keys.*.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genericmodel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.keys.accessKeyId }}: {{ .Values.s3.accessKeyId | quote }}
  {{ .Values.s3.keys.secretAccessKey }}: {{ .Values.s3.secretAccessKey | quote }}
  {{ .Values.s3.keys.endpoint }}: {{ .Values.s3.endpoint | quote }}
  {{ .Values.s3.keys.region }}: {{ .Values.s3.region | quote }}
{{- end }}
{{- end }}
