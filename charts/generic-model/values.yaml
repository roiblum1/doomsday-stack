# Generic per-model LLM serving bundle -- chart defaults.
#
# These defaults are deliberately MINIMAL: a real model deployment is a
# complete values file (start from the closest file under examples/ and
# edit). Required-field guards in the templates fail the render when a
# model deployment forgets: namespace, model.name, scc.name, llmisvc.name,
# aigatewayRoute.name.

namespace: ""
nameOverride: ""

# --- target nodes ---------------------------------------------------------
nodes:
  # Label the node-prep DaemonSet and the vLLM pods select on.
  gpuProduct: ""
  # The static local PVs' nodeAffinity lists ALL of these hostnames; every
  # node must have the model at the SAME host path (node-prep + pull jobs
  # guarantee that). Only needed with storage (PVC-based models).
  hostnames: []

# --- node storage (manual LVs, no MCO/MachineConfig available) -----------
nodePrep:
  enabled: false
  # MUST bundle the flashinfer_cubin dist package when the serving image
  # does not (air-gap): besides LVM work, node-prep seeds flashinfer's
  # trtllm-gen cubins FROM THIS IMAGE into the cache LV (idempotent).
  image: ""
  imagePullPolicy: IfNotPresent
  # Blank data disks the chart turns into the volume group when the VG does
  # not exist yet (fresh node). Leave EMPTY when the VG already exists
  # (e.g. day-1 /dev/md/lvmdata RAID): pvcreate REFUSES devices with
  # filesystem/partition signatures, so this can never clobber an in-use
  # disk. ensure_vg() only renders when this list is non-empty.
  devices: []
  # LVM volume group.
  vg: vg1
  # LVs are mounted here (same path on every node in nodes.hostnames).
  hostPathBase: /var/mnt/llm
  loopIntervalSeconds: 60
  # Cubin seeding sidecar parameters (donor rootfs + pgrep marker).
  # pgrepPattern pins the pattern to the sidecar's argv0.
  cubinSrc:
    pgrepPattern: "^lmcache-cubin-src"
    # Path of the flashinfer_cubin package inside the donor image.
    distPackagesPath: /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}

# --- static local PVs + pre-created PVCs ------------------------------------
storage:
  # Cluster-scoped like the SCC: every chart uses its OWN StorageClass name
  # (never share an ArgoCD-managed object with another chart's app).
  # Defaults to <fullname>-local-static; set explicitly to reuse an
  # existing cluster-side class.
  className: ""
  # The pre-created claim names. model.uri (PVC shape) and the pull jobs
  # derive from these -- change here, not in the templates.
  models:
    pvcName: ""
    lvName: llm-models
    lvSize: 100G
    pvSize: 100Gi
    subdir: models
  cache:
    pvcName: ""
    lvName: llm-cache
    lvSize: 100G
    pvSize: 100Gi
    subdir: cache
  # Stable L2 disk tier for the LMCache engine: local-static PVC the engine
  # CR mounts; node-prep creates and keeps mounted the backing LV.
  l2:
    pvcName: ""
    lvName: llm-l2
    lvSize: 100G
    pvSize: 100Gi
    subdir: lmcache-l2

# --- model + S3 source -----------------------------------------------------
model:
  # vLLM served-model-name (what clients send as "model"). REQUIRED.
  name: ""
  # Subdirectory inside the models PVC / S3 bucket. When set, model.uri
  # derives as pvc://<storage.models.pvcName>/<subPath> (pre-pulled models).
  # When unset, model.uri (below) is used verbatim (e.g. an s3:// URI the
  # kserve storage-initializer downloads into the pod).
  subPath: ""
  uri: ""
  s3:
    # s3://<this>/* -- where the pull jobs fetch the model from.
    path: ""

# S3 credentials. NEVER put real keys in values files -- default is to
# reference a pre-existing secret (created out-of-band). Set create: true
# only for testing, with keys passed via --set-file / external secrets.
# shape selects the created secret's shape:
#   pull-job: data keys named by s3.keys.* (what s5cmd pull jobs read)
#   kserve:   AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY data keys +
#             serving.kserve.io/s3-endpoint/-region annotations (what the
#             kserve controller's storage-initializer reads)
s3:
  create: false
  shape: pull-job
  secretName: ""
  # Only used by shape: pull-job (key NAMES in the referenced secret).
  keys:
    accessKeyId: AWS_ACCESS_KEY_ID
    secretAccessKey: AWS_SECRET_ACCESS_KEY
    endpoint: AWS_ENDPOINT_URL
    region: AWS_DEFAULT_REGION
  # Only used when create: true:
  endpoint: ""
  region: us-east-1
  accessKeyId: ""
  secretAccessKey: ""

# --- service accounts / SCC ------------------------------------------------
serviceAccount:
  name: s3sa

scc:
  # Cluster-scoped SecurityContextConstraints object name. REQUIRED.
  name: ""
  create: true
  # Text of the SCC's kubernetes.io/description annotation, as the lines
  # of its folded block (one list item = one rendered line).
  description:
    - Allows vLLM model-serving pods to run as root and add IPC_LOCK while
    - mounting local PVs, hugepage emptyDirs and secrets.

# --- images -----------------------------------------------------------------
images:
  # The vLLM serving image. With LMCache enabled, keep tag-for-tag with
  # lmcache.image: both sides of the ZMQ/CUDA-IPC protocol must run the
  # same LMCache build.
  vllm: ""
  s5cmd: registry-internal/tools/s5cmd:v2.3.0
  # KServe storage-initializer mirror (S3-uri models only): overrides the
  # controller-injected initContainer image (docker.io is not mirrored).
  storageInitializer: registry-internal/kserve/kserve/storage-initializer:v0.21.0-rc1

# --- per-node model pull jobs ------------------------------------------------
pullJobs:
  enabled: false
  concurrency: 128
  partSize: 256
  resources:
    requests: {cpu: "16", memory: 32Gi}
    limits: {cpu: "48", memory: 100Gi}

# --- gateways -----------------------------------------------------------------
# ONE Gateway for everything: the shared Envoy AI Gateway. The
# AIGatewayRoute attaches to it (model-header rules, extproc
# translation/passthrough) AND the KServe router HTTPRoute attaches to it
# as well (path-based rules).
gateway:
  aiGateway:
    name: envoy-ai-gateway
    namespace: envoy-ai-gateway-system
    listener: http

# --- the LLMInferenceService ---------------------------------------------------
llmisvc:
  # REQUIRED.
  name: ""
  # Fixed replica count. Ignored when scaling.enabled is true (the scaling
  # block renders instead of replicas).
  replicas: 1
  # runtimeClassName / priorityClassName are deliberately OPTIONAL: on the
  # proven L4 deployments the kserve preset merge only stays out of the way
  # when they are omitted. Leave unset unless the performance profile's
  # runtime class is needed (B200 deployments set it).
  runtimeClassName: ""
  schedulerName: default-scheduler
  terminationGracePeriodSeconds: 300
  rolloutStrategy:
    maxSurge: 0                # no free GPUs for a surge pod -> deadlock
    maxUnavailable: 1
  # WVA-driven autoscaling (llm-d Workload Variant Autoscaler -> KEDA ->
  # HPA, scaling on vLLM queue depth + KV-cache usage). DEFAULT OFF: a
  # spec.scaling block is NOT inert without WVA/KEDA installed (the
  # llmisvc-controller error-loops ReconcileScalingError). When enabled,
  # the template renders the scaling block instead of replicas
  # (replicas -> scaling.minReplicas).
  scaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    wva:
      keda:
        pollingInterval: 5
        cooldownPeriod: 30
  # Parallelism via the CRD field: the base preset renders
  # --tensor-parallel-size from spec.parallelism.tensor. Do NOT also pass
  # --tensor-parallel-size in args (duplicate flag). Omitted when unset.
  parallelism:
    tensor: 0
  # KServe storage-initializer override (s3:// model URIs only): renders
  # the initContainers block overriding the controller-injected
  # storage-initializer's image and resources (the controller merges:
  # image/resources here win, args/command stay the controller's).
  storageInitializer:
    enabled: false
    image: ""                  # defaults to images.storageInitializer
  # --- EPP (router scheduler) config -------------------------------------------
  # Rendered verbatim by the kserve controller into the EPP deployment's
  # --config-text (EndpointPickerConfig). Optional: without it the EPP
  # template only pins the serviceAccountName. When set, the block is
  # copied verbatim into spec.router.scheduler (pool spec + config).
  scheduler: {}
  # Free-form vLLM args list, copied verbatim (single tokens only: the
  # kserve preset launcher evals `vllm serve ... "$@"`).
  args: []
  env: {}
  resources: {}
  # Optional volumes (emptyDir Memory dshm, HugePages). dshmSize renders
  # the dshm volume; hugepagesSize additionally renders the hugepages
  # volume + its mount (B200 recipes).
  volumes:
    dshmSize: ""
    hugepagesSize: ""
  probes:
    # Probe target: DP multi-port external LB recipes point at the
    # supervisor's aggregated health endpoints on
    # --data-parallel-supervisor-port; internal-LB / TP recipes point at
    # the API server on the preset's base port 8000 (/readyz does not
    # exist there -- verified live; use /health).
    port: 8000
    startup:
      path: /health
      periodSeconds: 10
      failureThreshold: 180     # cold boot: model load + JIT + graph capture
      timeoutSeconds: 5
    readiness:
      path: /health
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 5
    liveness:
      path: /health
      periodSeconds: 30
      failureThreshold: 5
      timeoutSeconds: 5
  # Legacy vLLM OffloadingConnector KV-cache offloading (CPU tier in
  # /dev/shm). Mutually exclusive with lmcache.enabled (only one connector
  # may own the KV cache). Default unset.
  kvCacheOffloading: {}

# --- LMCache (node-local KV cache: RAM L1 + disk L2) --------------------------
lmcache:
  enabled: false
  # All remaining keys mirror the upstream lmcache-engine chart (shipped in
  # the operator package) 1:1, so its docs and guards apply here too.
  name: ""                      # = CR + Service name + <name>-connection CM
  image:
    # Keep tag-for-tag with images.vllm (both sides of the protocol must
    # run the same LMCache build).
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccountName: ""
  isolatedIPC: true
  privileged: false
  gpuVendor: nvidia
  hostIPC: false
  hostNetwork: false
  logLevel: INFO
  nodeSelector: {}
  priorityClassName: openshift-user-critical
  server:
    port: 5555                 # ZMQ, what vLLM connects to
    httpPort: 8080             # health/HTTP frontend
    # MUST be a multiple of lmcache.chunkSizeModulus (template fails the
    # render otherwise; the modulus is model/arch-specific -- see the
    # per-model examples). Only whole chunks are cached.
    chunkSize: 256
    # Rendered explicitly (CRD default 256 may violate the modulus guard).
    chunkSizeModulus: 0         # 0 disables the guard
    # ZMQ worker threads. Keep >= the DP ranks per node.
    maxWorkers: 8
    hashAlgorithm: blake3
  l1:
    sizeGB: 100
  # Top-level (it governs the L1 tier).
  eviction:
    policy: LRU
    triggerWatermark: 0.8
    evictionRatio: 0.2
  # Disk tier: stable local-static PVC (storage.l2.pvcName) backed by a
  # node-prep-managed LV. maxCapacityGB must stay below storage.l2.pvSize
  # (the template refuses values >= pvSize) for filesystem overhead.
  l2:
    enabled: false
    mountPath: /mnt/lmcache-l2
    maxCapacityGB: 80
    directIO: false
    # Spread files over hashed subdirectories. Choose once: flipping later
    # orphans existing files.
    shardDirs: true
    persist: true
    eviction:
      policy: LRU
      triggerWatermark: 0.9
      evictionRatio: 0.1
    storePolicy: default
    prefetchPolicy: default
    prefetchMaxInFlight: 8
  # Model-recipe flags appended last (can override operator-generated
  # flags), e.g. ["--separate-object-groups"].
  extraArgs: []
  env: []
  prometheus:
    enabled: true
    # v0.5.5's engine serves /metrics on the http frontend (httpPort) --
    # the operator passes --prometheus-port through but the engine ignores
    # it. Point the operator-generated metrics Service (and thus the
    # ServiceMonitor) at the real listener, or Prometheus scrapes nothing.
    port: 8080
    serviceMonitor:
      # Scraped by the platform Prometheus (openshift-monitoring k8s) via
      # the openshift.io/cluster-monitoring namespace label.
      enabled: true
      interval: 30s
    rules:
      # PrometheusRule (engine down / no targets / L2 headroom / eviction
      # pressure / cache-bypass). Alerting group name is
      # <fullname>-lmcache.rules.
      enabled: true

# --- Envoy AI Gateway route ---------------------------------------------------
aigatewayRoute:
  # REQUIRED.
  name: ""
  enabled: true
  # Header the extproc derives from the request body's "model" field.
  headerName: x-ai-eg-model
  # Default request timeout 60s kills long reasoning -> raise per model.
  requestTimeout: 900s
  # OpenAI-protocol model id that keeps the EPP/InferencePool path.
  # DEFAULT (unset): publishers/<namespace>/models/<model.name> -- the id
  # the kserve base preset also serves.
  openaiModel: ""
  # Safety net for Claude Code clients that do NOT remap their model name
  # (no ANTHROPIC_DEFAULT_*_MODEL): anything matching the regex routes to
  # the direct backend with the model rewritten to model.name. Only valid
  # with directBackend.schema: Anthropic.
  claudeAlias:
    enabled: false
    regex: '^claude-.*$'

# --- direct backend (quota path) ----------------------------------------------
# Replaces the per-model charts' anthropicBackend/openaiBackend: ONE
# AIServiceBackend attached to the shared Envoy AI Gateway that the short
# model name routes to, so Envoy AI Gateway QuotaPolicy -- what aigw-ui
# renders for per-tenant token quotas -- can attach (QuotaPolicy
# targetRefs only accept AIServiceBackend, never InferencePool).
#
# schema: Anthropic (Claude Code /anthropic/v1/messages passthrough; vLLM
# >= v0.25 serves the Messages API natively) or OpenAI (/v1/chat/completions
# passthrough to the workload service).
#
# style: how the Envoy Gateway Backend's endpoints are built:
#   workload-svc: ONE FQDN endpoint -- <workloadService.name (defaults to
#     <llmisvc.name>-kserve-workload-svc)>.<ns>.svc:<workloadService.port>.
#     The kserve-owned workload svc already carries the port (internal DP
#     LB: one API server behind :8000 covers all ranks).
#   ranks: a chart-owned Service exposing the DP rank ports (the kserve
#     workload svc only carries port 8000/rank 0) + one Backend FQDN
#     endpoint per rank port: ranksService.firstPort ..
#     firstPort+portCount-1.
directBackend:
  enabled: false
  # Rule name on the AIGatewayRoute. Default derives from the schema
  # (anthropic-native / openai-direct); set explicitly for parity with a
  # migrated per-model chart.
  ruleName: ""
  schema: Anthropic            # Anthropic | OpenAI
  name: ""                     # AIServiceBackend name. REQUIRED when enabled.
  backendName: ""              # Envoy Gateway Backend name. REQUIRED when enabled.
  style: workload-svc          # workload-svc | ranks
  workloadService:
    name: ""                   # defaults to <llmisvc.name>-kserve-workload-svc
    port: 8000
  ranksService:
    name: ""                   # REQUIRED when style: ranks
    firstPort: 8000
    portCount: 8

# --- optional AIPerf benchmark Job ---------------------------------------------
aiperf:
  enabled: false
  name: ""
  version: 0.7.0
  pypiIndex: https://registry-internal/pypi/simple/
  pypiHost: registry-internal
  # Target the in-cluster Envoy AI Gateway service (full path incl. EPP).
  url: http://envoy-ai-gateway.envoy-gateway-system.svc:80
  streaming: true
  concurrency: 64
  numPrompts: 512
  inputTokensMean: 1024
  inputTokensStddev: 256
  outputTokensMean: 256
  resources:
    requests: {cpu: "8", memory: 16Gi}
    limits: {cpu: "16", memory: 32Gi}
