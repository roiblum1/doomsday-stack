apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rdma-exporter
  namespace: rdma-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "rdma-exporter.labels" . | nindent 4 }}
spec:
  port:
    targetPort: metrics
  tls:
    termination: edge
  to:
    kind: Service
    name: rdma-exporter
    weight: 100
  wildcardPolicy: None
