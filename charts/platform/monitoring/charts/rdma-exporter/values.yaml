image:
  # The exporter runs inside the DOCA driver image (python3 + OFED userspace).
  # Tag is the 4.22-upgrade target (intentionally ahead of the live DaemonSet);
  # registry host mirrors the live cluster pull route.
  repository: registry-internal/operators/nvidia-network-operator/nvidia-network-operator/doca-driver
  tag: doca3.4.1-26.04-192.0.2.1-5-rhel9.8-amd64
  pullPolicy: IfNotPresent

env:
  clusterName: ""  # Override via global.clusterName
  rdmaExporterAddr: "0.0.0.0"
  rdmaExporterPort: "9402"
  logLevel: info
  enableGpu: "1"
  enableRdmaRes: "1"
  enableEthtool: "1"
  hostRoot: /host
  nvidiaLdLibraryPath: /run/nvidia/driver/usr/lib64
  nvidiaSmiPath: ""
  cacheTtl: "60"
  metricsCacheTtl: "10"
  aggregateCacheTtl: "60"
  aggregateMaxWorkers: "16"
  aggregateScrapeTimeout: "10"
  scrapeTimeout: "30"
  podLabelSelector: app.kubernetes.io/name=rdma-exporter

daemonset:
  nodeSelector:
    nvidia.com/driver-config: "roce"
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

serviceMonitor:
  interval: 15s
  scrapeTimeout: 10s
