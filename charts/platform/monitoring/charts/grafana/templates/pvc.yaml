apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: {{ .Values.persistence.storageClassName }}
