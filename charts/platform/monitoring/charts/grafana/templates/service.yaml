apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app: grafana
