apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp-server
  namespace: prometheus-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: prometheus-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: prometheus-mcp-server
      initContainers:
        - name: wait-for-token
          image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until [ -s /mnt/sa-token/token ]; do echo "waiting for service account token to be populated..."; sleep 1; done
          volumeMounts:
            - mountPath: /mnt/sa-token
              name: sa-token
              readOnly: true
      containers:
        - name: prometheus-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl }}
            - name: PROMETHEUS_MCP_SERVER_TRANSPORT
              value: http
            - name: PROMETHEUS_MCP_BIND_HOST
              value: "0.0.0.0"
            - name: PROMETHEUS_MCP_BIND_PORT
              value: "8080"
            - name: PROMETHEUS_URL_SSL_VERIFY
              value: {{ .Values.prometheusSslVerify | quote }}
            - name: PROMETHEUS_DISABLE_LINKS
              value: {{ .Values.prometheusDisableLinks | quote }}
            - name: PROMETHEUS_REQUEST_TIMEOUT
              value: {{ .Values.prometheusRequestTimeout | quote }}
            - name: PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: prometheus-mcp-server-token
                  optional: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: sa-token
          secret:
            defaultMode: 420
            secretName: prometheus-mcp-server-token
