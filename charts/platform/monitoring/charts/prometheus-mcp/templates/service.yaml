apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp-server
  namespace: prometheus-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: prometheus-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: prometheus-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
