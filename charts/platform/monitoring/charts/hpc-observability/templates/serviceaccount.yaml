apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hpc-observability.fullname" . }}
  namespace: hpc-observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # OpenShift auto-injects the internal-registry dockercfg pull secret into
    # .secrets / .imagePullSecrets and the openshift.io/internal-registry-pull-secret-ref
    # annotation after the SA is created. Tell ArgoCD to ignore those injected
    # fields so the SA doesn't show perpetual OutOfSync drift.
    argocd.argoproj.io/sync-options: IgnoreDifferences=true
  labels:
    {{- include "hpc-observability.labels" . | nindent 4 }}
# No imagePullSecrets: OpenShift auto-injects the internal-registry dockercfg
# into the SA (matches the live ServiceAccount).
