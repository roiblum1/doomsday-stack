apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscription.name }}
  namespace: {{ .Values.subscription.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "nrop.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.subscription.channel | quote }}
  name: {{ .Values.subscription.name }}
  source: {{ .Values.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
  {{- with .Values.subscription.startingCSV }}
  startingCSV: {{ . }}
  {{- end }}
  installPlanApproval: {{ .Values.subscription.installPlanApproval | default "Automatic" }}
