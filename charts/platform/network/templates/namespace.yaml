{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "network.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- with .Values.namespace.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.maintenanceSubscription.enabled .Values.maintenanceNamespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.maintenanceNamespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- with .Values.maintenanceNamespace.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
