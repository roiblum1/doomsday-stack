{{- /*
RoCE mode: one NodeNetworkConfigurationPolicy per (node, NIC). Each node's rail NIC has a
unique host IP, so the policy is pinned to that node by hostname (a cluster-wide policy
cannot carry a different IP per node). Per NIC: static IPv4 + routes, optionally split
across a per-NIC routing table (table-id) with source-based route-rules for deterministic
NIC selection (NCCL_CROSS_NIC=0 enforced host-side).
Schema: nmstate.io ethernet interface + top-level routes.config[] + route-rules.config[].

RoCE LAG: when a NIC entry has `bond`, its `name` is a bond over bond.ports (both ports of
one dual-port card, and only them: that is what makes the mlx5 driver merge the card into
one RDMA device, mlx5_bond_N). The IP, route-rule and routes then sit on the bond; the
ports carry only the MTU.
*/}}
{{- if eq .Values.mode "roce" }}
{{- $bondDefaults := .Values.roce.bond | default dict }}
{{- range $node := .Values.roce.nodes }}
{{- range $nicIdx, $nic := $node.nics }}
{{- $parts := splitList "/" $nic.ip }}
{{- $ip := index $parts 0 }}
{{- $prefix := index $parts 1 }}
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: roce-{{ $node.name }}-{{ $nic.name }}
  labels:
    {{- include "nmstate-rdma.labels" $ | nindent 4 }}
spec:
  nodeSelector:
    kubernetes.io/hostname: {{ $node.name }}
  desiredState:
    interfaces:
      {{- if $nic.bond }}
      {{- if ne (len $nic.bond.ports) 2 }}
      {{- fail (printf "roce.nodes[%s].nics[%s].bond.ports must list exactly the two ports of one card (RoCE LAG)" $node.name $nic.name) }}
      {{- end }}
      {{- range $port := $nic.bond.ports }}
      - name: {{ $port }}
        type: ethernet
        state: up
        mtu: {{ $.Values.roce.mtu }}
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      {{- end }}
      - name: {{ $nic.name }}
        type: bond
        state: up
        mtu: {{ $.Values.roce.mtu }}
        link-aggregation:
          mode: {{ $nic.bond.mode | default $bondDefaults.mode | default "802.3ad" }}
          options:
            {{- toYaml (mergeOverwrite (deepCopy ($bondDefaults.options | default (dict))) (deepCopy ($nic.bond.options | default (dict)))) | nindent 12 }}
          port:
            {{- range $port := $nic.bond.ports }}
            - {{ $port }}
            {{- end }}
      {{- else }}
      - name: {{ $nic.name }}
        type: ethernet
        state: up
        mtu: {{ $.Values.roce.mtu }}
      {{- end }}
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: {{ $ip }}
              prefix-length: {{ $prefix }}
        ipv6:
          enabled: false
    {{- if or $nic.routeRules $nic.tableID }}
    route-rules:
      config:
        {{- if $nic.routeRules }}
        {{- range $rule := $nic.routeRules }}
        - ip-from: {{ $rule.ipFrom }}
          priority: {{ $rule.priority }}
          route-table: {{ $rule.routeTable }}
        {{- end }}
        {{- else if $nic.tableID }}
        - ip-from: {{ $ip }}/32
          priority: {{ $nic.routeRulePriority | default (add 1000 $nicIdx) }}
          route-table: {{ $nic.tableID }}
        {{- end }}
    {{- end }}
    routes:
      config:
        {{- if $nic.absentRoutes }}
        {{- range $absent := $nic.absentRoutes }}
        - destination: {{ $absent.dst }}
          next-hop-address: {{ $absent.nh }}
          next-hop-interface: {{ $nic.name }}
          state: absent
        {{- end }}
        {{- end }}
        {{- range $route := $nic.routes }}
        {{- $isStr := kindIs "string" $route }}
        {{- $dst := $route }}
        {{- $tableID := $nic.tableID }}
        {{- $nh := $nic.gateway }}
        {{- $iface := $nic.name }}
        {{- if not $isStr }}
        {{- $dst = $route.destination }}
        {{- if $route.tableID }}{{ $tableID = $route.tableID }}{{ end }}
        {{- if $route.nextHopAddress }}{{ $nh = $route.nextHopAddress }}{{ end }}
        {{- if $route.nextHopInterface }}{{ $iface = $route.nextHopInterface }}{{ end }}
        {{- end }}
        - destination: {{ $dst }}
          next-hop-address: {{ $nh }}
          next-hop-interface: {{ $iface }}
          {{- if $tableID }}
          table-id: {{ $tableID }}
          {{- end }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
