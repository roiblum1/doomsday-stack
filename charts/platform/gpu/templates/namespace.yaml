{{- if .Values.namespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "gpu.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- with .Values.namespace.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.clockLock.enabled .Values.clockLock.namespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clockLock.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "clock-lock.labels" . | nindent 4 }}
{{- end }}
