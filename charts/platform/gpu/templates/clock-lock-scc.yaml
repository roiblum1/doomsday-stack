{{- if and .Values.clockLock.enabled .Values.clockLock.scc.create }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Values.clockLock.scc.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    kubernetes.io/description: 'clock-lock-privileged allows the clock-lock daemonset to run with host PID, IPC, privileged containers, and hostPath volumes for GPU monitoring'
  labels:
    {{- include "clock-lock.labels" . | nindent 4 }}
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: false
allowHostPID: true
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
  - '*'
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities: null
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - '*'
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:{{ .Values.clockLock.namespace.name }}:{{ .Values.clockLock.serviceAccount.name }}
volumes:
  - '*'
{{- end }}
