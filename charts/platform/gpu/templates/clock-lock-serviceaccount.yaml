{{- if and .Values.clockLock.enabled .Values.clockLock.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clockLock.serviceAccount.name }}
  namespace: {{ .Values.clockLock.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "clock-lock.labels" . | nindent 4 }}
{{- with .Values.clockLock.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
