{{- if .Values.istio.enabled }}
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: {{ .Values.istio.name }}
  annotations:
    # Wave 5: after the Subscription (3) installs the CRDs and IstioCNI (4) is in place —
    # the sail operator wants the CNI plugin ready before the control plane.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    {{- include "istio.labels" . | nindent 4 }}
spec:
  namespace: {{ .Values.istio.namespace }}
  updateStrategy:
    inactiveRevisionDeletionGracePeriodSeconds: {{ .Values.istio.updateStrategy.inactiveRevisionDeletionGracePeriodSeconds }}
    type: {{ .Values.istio.updateStrategy.type }}
  values:
    pilot:
      env:
        ENABLE_GATEWAY_API_INFERENCE_EXTENSION: {{ .Values.istio.values.pilot.env.ENABLE_GATEWAY_API_INFERENCE_EXTENSION | quote }}
  version: {{ .Values.istio.version }}
{{- end }}
