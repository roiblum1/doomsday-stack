apiVersion: v2
name: qwen36-judge
description: >-
  Qwen3.6-35B-A3B-FP8 ("judge") on the L4 GPU node as ONE KServe
  LLMInferenceService (serving.kserve.io/v1alpha2), 2x L4 per replica
  (TP2), autoscaled 1->3 replicas via WVA/KEDA, behind the llm-d router
  (EPP + InferencePool) and the shared Envoy AI Gateway
  (AIGatewayRoute). Model pre-pulled from S3 into a node-local LVMS PVC
  by an idempotent pull Job (no storage-initializer, no LMCache).
type: application
version: 0.2.2
appVersion: "qwen3.6-35b-a3b-fp8"
kubeVersion: ">=1.29.0-0"
