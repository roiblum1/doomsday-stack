{{- if .Values.aigatewayRoute.enabled }}
# Agent Router (Envoy AI Gateway) route on the shared gateway (VIP
# 192.0.2.7): header-based model routing. The extproc derives
# x-ai-eg-model from the request body's "model" field, so OpenAI clients
# that send {"model": "judge"} select a rule on /v1/chat/completions
# without any header.
#
# Rule map (first match wins, all Exact):
#   judge                             -> openai-direct: AIServiceBackend
#                                       (direct quota path; see
#                                       openai-backend.yaml)
#   publishers/llm-judge/models/judge -> openai-epp: InferencePool (EPP,
#                                       queue-aware scheduling)
#   anything else                    -> auto-generated route-not-found 404
#
# vLLM natively serves BOTH model ids (the base preset sets both
# --served-model-name values), so neither rule needs a model rewrite.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ .Values.aigatewayRoute.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qwen36-judge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.aiGateway.name }}
      namespace: {{ .Values.gateway.aiGateway.namespace }}
      sectionName: {{ .Values.gateway.aiGateway.listener }}
  rules:
    # --- quota path: direct OpenAI backend ----------------------------------
    # First match wins: the short model name (what the hook sends) routes
    # to an AIServiceBackend so Envoy AI Gateway QuotaPolicy -- what
    # aigw-ui renders for per-tenant token quotas -- can attach to it
    # (QuotaPolicy targetRefs accept only AIServiceBackend, never
    # InferencePool; a pool-only model can never be quota-managed).
    {{- if .Values.openaiBackend.enabled }}
    - name: openai-direct
      matches:
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.model.name }}
      backendRefs:
        # group/kind omitted: defaults to AIServiceBackend
        # (aigateway.envoyproxy.io) -- the CRD only accepts an explicit
        # group for InferencePool refs.
        # modelNameOverride is REQUIRED for quotas: a QuotaPolicy
        # perModelQuotas.modelName only applies when it matches this
        # value (silently ignored otherwise -- quota-policy docs). The
        # override is a no-op rewrite here: requests already send
        # "judge" as the model id.
        - name: {{ .Values.openaiBackend.name }}
          modelNameOverride: {{ .Values.model.name }}
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
    {{- end }}
    # --- OpenAI protocol via EPP/InferencePool --------------------------------
    # vLLM natively serves this model id, so no model rewrite is needed.
    # While openaiBackend is enabled the short name is taken by
    # openai-direct above, so only the publishers alias reaches this
    # rule; disabled, both names share it (the original single rule).
    - name: openai-epp
      matches:
        {{- if not .Values.openaiBackend.enabled }}
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: {{ .Values.model.name }}
        {{- end }}
        - headers:
            - type: Exact
              name: {{ .Values.aigatewayRoute.headerName }}
              value: publishers/{{ .Values.namespace }}/models/{{ .Values.model.name }}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ .Values.llmisvc.name }}-inference-pool
      timeouts:
        request: {{ .Values.aigatewayRoute.requestTimeout }}
  llmRequestCosts:
    - {metadataKey: llm_input_token, type: InputToken}
    - {metadataKey: llm_output_token, type: OutputToken}
    - {metadataKey: llm_reasoning_token, type: ReasoningToken}
    - {metadataKey: llm_total_token, type: TotalToken}
{{- end }}
