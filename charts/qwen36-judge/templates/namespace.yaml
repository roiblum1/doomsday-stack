# Namespace for everything the chart deploys. Applied first so plain
# `oc apply -f` (non-Helm) installs also work in one shot.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "qwen36-judge.labels" . | nindent 4 }}
    {{- if .Values.peer.enabled }}
    # The gateway's peer listener accepts routes only from namespaces that
    # carry this label.
    aigw-ui.io/serving: "true"
    {{- end }}
