# Service account for the vLLM serving pods. The S3 secret link is how
# the KServe controller finds the storage-initializer credentials: it
# reads every secret linked to the workload SA and injects the AWS_*
# env from the one carrying AWS_SECRET_ACCESS_KEY (the
# serving.kserve.io/s3-endpoint ANNOTATION on that secret becomes
# AWS_ENDPOINT_URL). It must also keep the EPP's SA pinned (router
# template) to avoid the OCM dockercfg-adoption fight.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qwen36-judge.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.s3.secretName }}
