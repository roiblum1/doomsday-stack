# Service account for the model pull jobs and the vLLM serving pods.
# The S3 secret is linked so pull-job pods can read model weights from
# object storage (created out-of-band, see values.yaml s3 block).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qwen38.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.s3.secretName }}
