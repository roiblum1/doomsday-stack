name: qwen36-judge
projectNamespace: llm-judge
repourl: 'https://git.example.internal/popai/helm-charts/qwen36-judge-chart.git'
targetRevision: main
preserveResourcesOnDeletion: true
syncPolicy:
  syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
  # The three popai charts depend on CRDs each other installs
  # (EnvoyProxy/InferencePool from envoy-gateway, cert-manager.io from
  # cert-manager), so a first sync attempt can legitimately fail; retry
  # until the dependencies land instead of stalling the Application.
ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    jsonPointers:
      - /secrets
      - /imagepullsecrets