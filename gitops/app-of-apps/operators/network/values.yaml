# NVIDIA Network operator + NVIDIA Maintenance operator + NIC Configuration.
#
# NNO and NMO live in SEPARATE namespaces with separate OperatorGroups (matching the live
# install topology), but stay in the SAME chart (per the day-2 grouping requirement):
#   - NNO (nvidia-network-operator): OwnNamespace install mode -> own NS + own OG targeting
#     that NS. Provides OFED/DOCA + NicClusterPolicy (which deploys the NCO daemon).
#   - NMO (nvidia-maintenance-operator): AllNamespaces install mode -> own NS + own OG with
#     EMPTY targetNamespaces (cluster-wide). Needed because it orchestrates node drain/
#     maintenance across all namespaces; a single-namespace OG would cripple it.
# nic-config (NCO) is delivered via NicClusterPolicy.nicConfigurationOperator (no separate
# subscription).
#
# Image repositories/versions are intentionally EMPTY here — they are per-cluster (image
# SHA pinning). Override them in mces/<mce>/<cluster>/network/values.yaml.

# --- Network operator namespace + OperatorGroup (OwnNamespace) ---
namespace:
  name: nvidia-network-operator
  create: true
  labels: {}

operatorGroup:
  name: nvidia-network-operator
  targetNamespaces:
    - nvidia-network-operator

# --- Network operator subscription ---
subscription:
  name: nvidia-network-operator
  namespace: nvidia-network-operator
  channel: stable
  source: generic-cs-certified
  sourceNamespace: openshift-marketplace
  startingCSV: nvidia-network-operator.v26.4.1
  installPlanApproval: Automatic

# --- Maintenance operator: OWN namespace + AllNamespaces OperatorGroup ---
maintenanceNamespace:
  name: nvidia-maintenance-operator
  create: true
  labels: {}

# AllNamespaces OG = empty targetNamespaces (cluster-wide watch). Matches the live
# OperatorGroup nvidia-maintenance-operator-* generated by OLM.
maintenanceOperatorGroup:
  name: nvidia-maintenance-operator
  targetNamespaces: []   # empty = AllNamespaces

maintenanceSubscription:
  enabled: true
  name: nvidia-maintenance-operator
  namespace: nvidia-maintenance-operator
  channel: stable
  source: generic-cs-certified
  sourceNamespace: openshift-marketplace
  startingCSV: nvidia-maintenance-operator.v26.4.0
  installPlanApproval: Automatic

# --- Fabric type ---
# roce        : the NicClusterPolicy nodeAffinity/tolerations below scope ALL managed
#               DaemonSets to node-role.kubernetes.io/roce nodes (mixed clusters can also
#               have non-RDMA nodes). nicConfigurationTemplate (RoCE QoS tuning) applies.
# infiniband  : every worker is an IB RDMA node — the nodeAffinity/tolerations are DROPPED
#               (all operands run cluster-wide) and per-cluster values typically disable
#               nicConfigurationOperator/nvIpam/rdmaSharedDevicePlugin (OFED-only policy,
#               like an NVIDIA DGX basepod). Set fabric: infiniband in
#               mces/<mce>/<cluster>/network/values.yaml.
fabric: roce

# --- NicClusterPolicy ---
nicClusterPolicy:
  enabled: true
  name: nic-cluster-policy
  # RoCE-only block: rendered ONLY when fabric=roce. Scopes ALL managed DaemonSets (OFED
  # driver, nic-config daemon, RDMA shared device plugin, NV IPAM) to the RoCE nodes
  # (node-role.kubernetes.io/roce: "") and tolerates the roce taint. Non-RoCE nodes get
  # none of these operands. NicConfigurationTemplate separately nodeSelects roce.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/roce
              operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/roce
      operator: Exists
      effect: NoSchedule

# OFED Driver
ofedDriver:
  repository: ""           # Override per-cluster, e.g. registry-internal/operators/nvidia/mellanox
  image: doca-driver
  version: ""              # Override per-cluster (tag or SHA)
  forcePrecompiled: false
  certConfigName: artifactory-ca    # Global CA ConfigMap for registry TLS
  imagePullSecrets:                 # Global pull secret for all clusters
    - mirror-registry-ps
  autoUpgrade: false
  drainForce: false
  readinessInitialDelaySeconds: 11
  env:
    - name: UNLOAD_STORAGE_MODULES
      value: "true"
    - name: RESTORE_DRIVER_ON_POD_TERMINATION
      value: "true"
  maxParallelUpgrades: 1

# NIC Configuration Operator (deployed by NicClusterPolicy.nicConfigurationOperator)
# enabled=false omits the section from the NicClusterPolicy (IB clusters typically run
# without nic-config — no port tuning needed on IB rails).
nicConfigurationOperator:
  enabled: true
  daemonImage: nic-configuration-operator-daemon
  daemonVersion: ""        # Override per-cluster (SHA)
  daemonRepository: ""     # Override per-cluster
  daemonImagePullSecrets:  # Global pull secret for all clusters
    - mirror-registry-ps
  operatorImage: nic-configuration-operator
  operatorVersion: ""      # Override per-cluster (SHA)
  operatorRepository: ""   # Override per-cluster
  operatorImagePullSecrets: # Global pull secret for all clusters
    - mirror-registry-ps

# NV IPAM (only needed by RDMA device-plugin secondary networks / IPoIB CNI; unused in
# OFED-only IB clusters).
nvIpam:
  enabled: true
  image: nvidia-k8s-ipam
  version: ""              # Override per-cluster (SHA)
  repository: ""           # Override per-cluster
  enableWebhook: false
  imagePullSecrets:        # Global pull secret for all clusters
    - mirror-registry-ps

# RDMA Shared Device Plugin (RoCE pods consume rdma/roce_backend from secondary SR-IOV
# networks. IB pods use host IB via device mounts instead — typically disabled there).
rdmaSharedDevicePlugin:
  enabled: true
  image: k8s-rdma-shared-dev-plugin
  version: ""              # Override per-cluster (SHA)
  repository: ""           # Override per-cluster
  resourceName: roce_backend
  rdmaHcaMax: 1
  ifNames: []              # Override per-cluster with NIC names
  # Base selectors applied to every pool. ANDed together; missing selectors are ignored.
  # Add device IDs for all RoCE fabric NIC generations that may exist in the cluster.
  selectors:
    # Base whitelist for all RoCE-capable Mellanox Ethernet NICs.
    # Add future deviceIDs here so new node pools only need a NicNodePolicy entry.
    # 1023=ConnectX-8, 1021=ConnectX-7, 101f=ConnectX-6 Lx, 101d=ConnectX-6 Dx, 101b=ConnectX-6
    vendors: ["15b3"]
    deviceIDs: ["1023", "1021", "101f", "101d", "101b"]
    linkTypes: ["ether"]
  imagePullSecrets:        # Global pull secret for all clusters
    - mirror-registry-ps

# NicNodePolicies — use this for heterogeneous RoCE clusters where different node pools
# need different RDMA ifNames or driver settings. When enabled, ofedDriver and
# rdmaSharedDevicePlugin are removed from NicClusterPolicy. See agent-network-operator.md.
nicNodePolicies:
  enabled: false
  policies: []

# NIC Configuration Template (RoCE optimization) — wave 4
nicConfigurationTemplate:
  enabled: true
  name: roce
  nicType: "101d"
  pciAddresses: []         # Override per-cluster
  nodeSelector:
    node-role.kubernetes.io/roce: ""
  resetToDefault: false
  linkType: Ethernet
  numVfs: 0
  gpuDirectOptimized:
    enabled: true
    env: Baremetal
  pciPerformanceOptimized:
    enabled: true
    maxAccOutRead: 44
    maxReadRequest: 4096
  roceOptimized:
    enabled: true
    qos:
      pfc: "0,0,0,1,0,0,0,0"
      trust: dscp
