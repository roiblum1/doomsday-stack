# Written by aigw-ui (Deployments): the app config of e2e-r035-small, from qwen-tiny's.
chartPath: charts/model-deployer
ignoreDifferences:
- group: aigateway.envoyproxy.io
  jqPathExpressions:
  - .spec.rules[].backendRefs[].priority
  - .spec.rules[].backendRefs[].weight
  - .spec.rules[].modelsOwnedBy
  kind: AIGatewayRoute
- group: batch
  jsonPointers:
  - /spec/template/metadata/labels
  kind: Job
name: e2e-r035-small
preserveResourcesOnDeletion: true
projectNamespace: e2e-r035-small
repourl: https://github.com/roiblum1/doomsday-stack.git
syncPolicy:
  retry:
    backoff:
      duration: 30s
      factor: 2
      maxDuration: 5m
    limit: 10
  syncOptions:
  - CreateNamespace=true
  - SkipDryRunOnMissingResource=true
  - ServerSideApply=true
  - RespectIgnoreDifferences=true
targetRevision: main
