name: qwen38
projectNamespace: llm-qwen38
repourl: 'https://git.example.internal/popai/helm-charts/model-deployer-chart.git'
# One chart for every model (charts/model-deployer); the model's recipe is
# operators/qwen38/values.yaml.
targetRevision: main
preserveResourcesOnDeletion: true
syncPolicy:
  syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - ServerSideApply=true
    # REQUIRED by the Job ignoreDifferences below: with SSA alone,
    # ignoreDifferences only masks the diff but the apply still sends the
    # full manifest -- and the immutable Job spec.template then fails SSA
    # ("Job.batch ... is invalid: spec.template") on every chart bump.
    # RespectIgnoreDifferences=true strips ignored fields before apply.
    - RespectIgnoreDifferences=true
  # The chart deploys an LMCacheEngine (CRD from the day2 `lmcache` app)
  # and cluster-scoped SCC/PV objects, so a first sync attempt can
  # legitimately fail while dependencies land; retry instead of stalling
  # the Application.
  retry:
    limit: 10
    backoff:
      duration: 30s
      factor: 2
      maxDuration: 5m
ignoreDifferences:
  # OpenShift injects the rotating dockercfg secret into every SA's
  # `secrets` AND `imagePullSecrets`. jsonPointers are CASE-SENSITIVE:
  # `/imagepullsecrets` never matched, so the s3sa SA flapped OutOfSync and
  # its auto-generated secret kept popping in the diff on every refresh.
  - group: ""
    kind: ServiceAccount
    jsonPointers:
      - /secrets
      - /imagePullSecrets
    jqPathExpressions:
      - .secrets
      - .imagePullSecrets
  # The ai-gateway controller rewrites AIGatewayRoute rules after apply: it
  # defaults priority: 0 / weight: 1 on every backendRef and stamps
  # modelsOwnedBy: "Envoy AI Gateway" on every rule -- a permanent
  # render-vs-live diff otherwise. Matters since chart 0.2.0: the new
  # openai-direct rule carries an AIServiceBackend backendRef. Same entry
  # as qwen36-judge.yaml.
  - group: aigateway.envoyproxy.io
    kind: AIGatewayRoute
    jqPathExpressions:
      - .spec.rules[].backendRefs[].priority
      - .spec.rules[].backendRefs[].weight
      - .spec.rules[].modelsOwnedBy
  # spec.template is IMMUTABLE on Jobs, and the pull jobs' pod labels carry
  # helm.sh/chart -- so EVERY chart version bump makes SSA try an invalid
  # Job update and the sync task fails (first seen bumping 0.1.0 -> 0.2.0:
  # 'Job.batch "qwen38-pull-..." is invalid: spec.template'). Ignore the
  # pod-template labels; a real pull-job spec change still needs the Job
  # deleted out-of-band first.
  - group: batch
    kind: Job
    jqPathExpressions:
      - .spec.template.metadata.labels
