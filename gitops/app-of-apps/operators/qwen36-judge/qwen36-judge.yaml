name: qwen36-judge
projectNamespace: llm-judge
repourl: 'https://git.example.internal/popai/helm-charts/model-deployer-chart.git'
# One chart for every model (charts/model-deployer); the model's recipe is
# operators/qwen36-judge/values.yaml.
targetRevision: main
preserveResourcesOnDeletion: true
syncPolicy:
  syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    # The llmisvc was helm-installed once (rev 4, pre-Argo); without SSA
    # the app's apply can hit "metadata.resourceVersion: Invalid value: 0"
    # forever on those objects (same lesson as glm53.yaml).
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  # The three popai charts depend on CRDs each other installs
  # (EnvoyProxy/InferencePool from envoy-gateway, cert-manager.io from
  # cert-manager), so a first sync attempt can legitimately fail; retry
  # until the dependencies land instead of stalling the Application.
  retry:
    limit: 10
    backoff:
      duration: 30s
      factor: 2
      maxDuration: 5m
ignoreDifferences:
  # OpenShift injects the rotating dockercfg secret into every SA's
  # `secrets` AND `imagePullSecrets`. jsonPointers are CASE-SENSITIVE:
  # `/imagepullsecrets` never matched, so the s3sa SA flapped OutOfSync
  # and its auto-generated secret kept popping in the diff on every
  # refresh (fixed in glm53.yaml and qwen38.yaml; this catches up).
  - group: ""
    kind: ServiceAccount
    jsonPointers:
      - /secrets
      - /imagePullSecrets
    jqPathExpressions:
      - .secrets
      - .imagePullSecrets
  # The ai-gateway controller rewrites AIGatewayRoute rules after apply: it
  # defaults priority: 0 / weight: 1 on every backendRef and stamps
  # modelsOwnedBy: "Envoy AI Gateway" on every rule -- a permanent
  # render-vs-live diff otherwise. Matters since chart 0.2.0: the new
  # openai-direct rule carries an AIServiceBackend backendRef.
  - group: aigateway.envoyproxy.io
    kind: AIGatewayRoute
    jqPathExpressions:
      - .spec.rules[].backendRefs[].priority
      - .spec.rules[].backendRefs[].weight
      - .spec.rules[].modelsOwnedBy
  # A Job's pod template cannot change; its labels carry the chart's version
  # (the per-node pull jobs), which an upgrade of the chart changes.
  - group: batch
    kind: Job
    jsonPointers:
      - /spec/template/metadata/labels
