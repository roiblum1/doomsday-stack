# Per-cluster overrides for nmstate-rdma on cluster-gpu-test.
#
# RoCE LAG (2026-10-19): every H200 card's TWO 100G ports (f0np0 + f1np1, both cabled)
# run as ONE 802.3ad (LACP) bond, bond-rail<r>, instead of the single f0np0 port:
#
#   bond-rail<r> = ens<32+r>f0np0 + ens<32+r>f1np1   -> GPU<r>, same IP/gateway/table as before
#
# Why this gives 200G per GPU (and what it needs):
#   - RoCE LAG (NVIDIA DOCA, "RDMA over Converged Ethernet"): when both PFs of one
#     dual-port card, and only them, are in one bond of mode 1, 2 or 4, the driver
#     replaces the two RDMA devices with one, mlx5_bond_N, over both ports. The chart
#     refuses a bond with other than two ports.
#   - One QP is sent on one port, so one flow tops out at 100G. 802.3ad with
#     xmit_hash_policy layer3+4 (chart default, roce.bond) spreads QPs by the RoCEv2 UDP
#     source port, which differs per QP. NCCL opens one QP per connection by default:
#     set NCCL_IB_QPS_PER_CONNECTION >= 2 (4 is a common start) in the workload, and
#     NCCL_IB_HCA=mlx5_bond_0,...,mlx5_bond_7 (check the names with `rdma link`).
#   - A ConnectX-6 Dx card is PCIe Gen4 x16 (~200-220 Gb/s usable after PCIe overhead),
#     so 2 x 100G is the most one card can carry.
#   - OpenShift supports active-backup, balance-xor and 802.3ad bonds; 802.3ad needs a
#     matching LACP port-channel on the switch side.
#
# SWITCH SIDE (before or with this sync; without it the bond has no LACP partner and the
# rail carries nothing): per server and card, one LACP port-channel over the two leaf
# ports (mode active, rate fast to match lacp_rate: fast, MTU 9000+, PFC priority 3 and
# DSCP trust on both members), routed, with the rail's /31 gateway moved from the single
# leaf port to the port-channel.
#   - Both ports of a card on the SAME leaf: plain port-channel; fabric A (rails 0-3,
#     Leaf_01) and fabric B (rails 4-7, Leaf_02) stay as they are.
#   - Ports on TWO leaves (the pre-2026-09-10 cabling had f0 and f1 of a card on
#     different leaves): the leaves need MLAG/vPC for the port-channel, and a /31 cannot
#     sit on two switches; the gateway becomes a shared (VRR/anycast) address on a small
#     subnet, and every ip/gateway below changes.
#
# Server<->leaf-port notation Ethernet1/<server+1>/<rail+1> decodes directly:
#   server0 = 2sb9mc4  (leaf ports Eth1/1/*)  -> host .1, gateway .0
#   server1 = dsb9mc4  (leaf ports Eth1/2/*)  -> host .3, gateway .2
# The cluster has these two H200 servers only (2026-10-19); the former server2/server3
# entries (leaf ports Eth1/3/*, Eth1/4/*) were removed.
# Host/gateway IPs are the same as before the bonds; only the interface each rail
# lives on changes (the card's f0np0 port -> bond-rail<r> over f0np0 + f1np1).
#
# NIC->rail mapping (identical on every node; now each rail is the bond of the card):
#   ens32f0np0 -> Leaf_01 Eth1/<s>/1 = fabric-A rail0/GPU0 -> 192.168.100.x (table 200)
#   ens33f0np0 -> Leaf_01 Eth1/<s>/2 = fabric-A rail1/GPU1 -> 192.168.101.x (table 201)
#   ens34f0np0 -> Leaf_01 Eth1/<s>/3 = fabric-A rail2/GPU2 -> 192.168.102.x (table 202)
#   ens35f0np0 -> Leaf_01 Eth1/<s>/4 = fabric-A rail3/GPU3 -> 192.168.103.x (table 203)
#   ens36f0np0 -> Leaf_02 Eth1/<s>/1 = fabric-B rail4/GPU4 -> 192.168.104.x (table 204)
#   ens37f0np0 -> Leaf_02 Eth1/<s>/2 = fabric-B rail5/GPU5 -> 192.168.105.x (table 205)
#   ens38f0np0 -> Leaf_02 Eth1/<s>/3 = fabric-B rail6/GPU6 -> 192.168.106.x (table 206)
#   ens39f0np0 -> Leaf_02 Eth1/<s>/4 = fabric-B rail7/GPU7 -> 192.168.107.x (table 207)
#
# MIGRATION from the single-port NNCPs (roce-<node>-ens3Xf0np0 -> roce-<node>-bond-rail<r>).
# Do it one node at a time (cordon + drain; the rails of that node go down):
#   1. Switch: port-channels for that server's 8 cards, gateway on the port-channel.
#   2. Sync. The new NNCP sets the f0/f1 ports to "no IP" and makes the bond, so the old
#      address and its routes leave ens3Xf0np0. kubernetes-nmstate does NOT undo the old
#      NNCPs when they leave git, so check on the node (`oc debug node/<n>`, `chroot /host`):
#        ip -4 addr show | grep -E 'ens3[2-9]f[01]np[01]'   # nothing: IPs are on bond-rail*
#        for t in 200 201 202 203 204 205 206 207; do ip route show table $t; done
#        # every route says dev bond-rail<r>; delete any left on ens3Xf0np0
#        ip rule                                           # one from <ip> lookup 20<r> each
#   3. Check the bonds and RDMA:
#        cat /proc/net/bonding/bond-rail0   # 802.3ad, both ports up, same Aggregator ID,
#                                           # partner MAC not 00:00:00:00:00:00
#        rdma link show                     # mlx5_bond_0..7 ACTIVE on bond-rail<r>
#        mlnx_qos -i ens32f0np0; mlnx_qos -i ens32f1np1   # trust dscp, PFC 3, both ports
#      then ib_write_bw -q 4 (or more) to another node on one rail: about 2x the
#      single-port number means both links carry traffic.
#   4. Uncordon, next node.
# Never change the bonds by hand while the driver is loaded; change this file.
#
# HISTORY: until 2026-10-19 each rail was the f0np0 port alone (DC re-patch of
# 2026-09-10/11); before that, LLDP 2026-09-09 (commit ef39a2e) showed fabric A on the
# f1np1 ports of ens32-35 and fabric B on their f0np0 ports, with ens36-39 uncabled.
#
# NMState operator itself is cluster-scoped and will install. With mode: roce,
# NNCPs render only for the nodes listed in roce.nodes; all other nodes are
# untouched (the B300 GPU nodes are standalone GPU, no RoCE).

mode: roce
roleLabel: roce
roce:
  mtu: 9000
  # bond defaults (802.3ad, miimon 100, lacp_rate fast, xmit_hash_policy layer3+4) come
  # from the chart's roce.bond; override per bond under nics[].bond.options.
  nodes:
  # ----- server0: gpu-node-x...-2sb9mc4 (leaf ports Eth1/1/*) -----
  - name: gpu-node-x
    nics:
    - name: bond-rail0
      bond:
        ports:
        - ens32f0np0
        - ens32f1np1
      ip: 192.0.2.17/31
      gateway: 192.0.2.3
      routes:
      - destination: 0.0.0.0/0
      - destination: 192.0.2.2/16
      - destination: 192.0.2.2/16
        tableID: 254
      - destination: 192.0.2.3/24
        tableID: 254
      tableID: 200
      routeRulePriority: 1000
