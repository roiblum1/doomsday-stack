# Qwen3.8-27B-FP8 on one node of 4 L4 GPUs, tensor parallel, as qwen38-bundled
# serves it, without LMCache (that stays in qwen38-bundled). Set the image to
# your mirror and runtimeClassName to the node's performance profile.
preset:
  title: Qwen3.8-27B on 4 x L4
  description: Tensor parallel 4, FP8 KV cache, MTP 2, 64K context. Weights from S3 onto a PVC.
model:
  name: Qwen3.8-27B-FP8
  uri: s3://llms/Qwen/Qwen3.8-27B-FP8
  revision: qwen3.8-27b-fp8
  capacityPerInstance: "1"
  maxModelLen: 65536
storage:
  mode: cache
  cache:
    size: 60Gi
  s3:
    secretName: qwen38-s3
serving:
  image: registry-internal/vllm/vllm-openai:v0.30.0
  replicas: 1
  gpus: 4
  gpuProduct: NVIDIA-L4
  tensorParallel: 4
  runtimeClassName: ""
  terminationGracePeriodSeconds: 300
  shmSize: 8Gi
  startupSeconds: 1800
  args:
    - --kv-cache-dtype=fp8_e4m3
    - --gpu-memory-utilization=0.90
    - --max-num-seqs=32
    - --max-num-batched-tokens=8192
    - --kv-cache-metrics
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
    - --enable-force-include-usage
    - --enable-chunked-prefill
    - --speculative-config.method=mtp
    - --speculative-config.num_speculative_tokens=2
    - --per-request-spec-decode-metrics=summary
    - --reasoning-parser=qwen3
    - --tool-call-parser=qwen3_xml
    - --enable-auto-tool-choice
    - --trust-remote-code
  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    NCCL_IB_DISABLE: "1"
    OMP_NUM_THREADS: "16"
  resources:
    requests: {cpu: "48", memory: 64Gi}
    limits: {cpu: "96", memory: 128Gi}
# The plugin set of llm-d router v0.11.0, as qwen38-bundled configures it.
scheduler:
  config:
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: single-profile-handler
      - type: approx-prefix-cache-producer
      - type: inflight-load-producer
      - type: prefix-cache-scorer
      - type: active-request-scorer
      - type: token-load-scorer
      - type: max-score-picker
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: active-request-scorer
            weight: 3
          - pluginRef: token-load-scorer
            weight: 1
          - pluginRef: prefix-cache-scorer
            weight: 1
          - pluginRef: max-score-picker
