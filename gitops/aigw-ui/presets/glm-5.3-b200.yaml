# GLM-5.3 on whole B200 nodes, 8 data-parallel ranks with expert parallel, as
# glm53-bundled serves it. The weights come from the PVC glm53-bundled's node
# preparation fills (pvc://); its LMCache, compile-cache PVC and hugepages are
# not in this chart. Set the image and runtimeClassName for your site.
preset:
  title: GLM-5.3 on 8 x B200
  description: One pod per node, 8 data-parallel ranks (one scheduler endpoint each), expert parallel, MTP, 256K context.
model:
  name: glm-5.3
  uri: pvc://glm53-models/GLM-5.3
  objectName: glm53-b200
  revision: glm-5.3-flash-nvfp4
  capacityPerInstance: "1"
  maxModelLen: 262144
serving:
  image: registry-internal/vllm/vllm-openai:v0.30.0
  replicas: 2
  gpus: 8
  gpuProduct: NVIDIA-B200
  dataParallel:
    ranks: 8
    supervisorPort: 8208
  runtimeClassName: ""
  terminationGracePeriodSeconds: 300
  shmSize: 128Gi
  kvCacheOffloading:
    cpu: 64Gi
    evictionPolicy: lru
  startupSeconds: 1800
  args:
    - --enable-expert-parallel
    - --all2all-backend=allgather_reducescatter
    - --kv-cache-dtype=fp8_e4m3
    - --gpu-memory-utilization=0.92
    - --max-num-seqs=64
    - --max-num-batched-tokens=16384
    - --long-prefill-token-threshold=8192
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
    - --enable-force-include-usage
    - --per-request-spec-decode-metrics=summary
    - --kv-cache-metrics
    - --speculative-config.method=mtp
    - --speculative-config.num_speculative_tokens=5
    - --reasoning-parser=glm47
    - --tool-call-parser=glm47
    - --enable-auto-tool-choice
    - --trust-remote-code
  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    NCCL_IB_DISABLE: "1"
    NCCL_P2P_LEVEL: NVL
    NVSHMEM_REMOTE_TRANSPORT: none
    NVSHMEM_IB_ENABLE_IBGDA: "0"
    VLLM_USE_DEEP_GEMM: "1"
    OMP_NUM_THREADS: "16"
  resources:
    requests: {cpu: "96", memory: 512Gi}
    limits: {cpu: "192", memory: 2000Gi}
# llm-d router v0.11.0: an idle rank (about 3.95) always beats a busy one
# that holds the prefix (at most 3.5), as glm53-bundled sets it.
scheduler:
  config:
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: single-profile-handler
      - type: approx-prefix-cache-producer
      - type: inflight-load-producer
      - type: prefix-cache-scorer
      - type: active-request-scorer
        parameters:
          maxBusyScore: 0.5
      - type: token-load-scorer
      - type: max-score-picker
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: active-request-scorer
            weight: 3
          - pluginRef: token-load-scorer
            weight: 1
          - pluginRef: prefix-cache-scorer
            weight: 1
          - pluginRef: max-score-picker
