# A small model on CPU, the way the lab runs qwen-tiny: vLLM's CPU image,
# the weights on a PVC, one replica, two requests at a time.
preset:
  title: Small model on CPU
  description: Qwen2.5-0.5B on vLLM's CPU image, weights on a PVC. For a lab or a test site.
model:
  name: qwen-small
  uri: hf://Qwen/Qwen2.5-0.5B-Instruct
  revision: qwen2.5-0.5b
  capacityPerInstance: "1"
  maxModelLen: 8192
storage:
  mode: cache
  cache:
    size: 5Gi
serving:
  image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.29.0
  replicas: 1
  args:
    - --enable-prompt-tokens-details
    - --enable-force-include-usage
    - --dtype=bfloat16
  env:
    # GiB of host memory for the KV cache.
    VLLM_CPU_KVCACHE_SPACE: "4"
  resources:
    requests: {cpu: "4", memory: 8Gi}
    limits: {cpu: "8", memory: 12Gi}
scheduler:
  flowControl:
    enabled: true
    maxConcurrency: 2
    negativeBandMaxRequests: 4
peer:
  maxParallelRequests: 8
