# One Application per file under gitops/aigw-ui/deployments/<cluster>/,
# which aigw-ui's Deployments page writes. The file is the chart's values;
# its deployment.cluster and deployment.namespace say where it goes.
#
# A new file becomes an Application within requeueAfterSeconds; a change to
# a file reaches its Application at Argo CD's next refresh (3 minutes by
# default, at once with a webhook from the git server). Removing a file
# deletes the Application and, through the finalizer, what it deployed
# (except the weights PVC, which the chart keeps).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aigw-ui-models
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/roiblum1/doomsday-stack.git
        revision: main
        requeueAfterSeconds: 30
        files:
          - path: gitops/aigw-ui/deployments/*/*.yaml
  template:
    metadata:
      # aigw-ui finds an Application by these labels. The name is also the
      # tracking label on every object (63 characters at most).
      name: 'aigw-{{ .deployment.cluster }}-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        aigw-ui.io/cluster: '{{ .deployment.cluster }}'
        aigw-ui.io/deployment: '{{ trimSuffix ".yaml" .path.filename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: aigw-ui-models
      sources:
        - repoURL: https://github.com/roiblum1/doomsday-stack.git
          targetRevision: main
          path: charts/model-deployer
          helm:
            releaseName: '{{ trimSuffix ".yaml" .path.filename }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .path.filename }}'
        - repoURL: https://github.com/roiblum1/doomsday-stack.git
          targetRevision: main
          ref: values
      destination:
        name: '{{ .deployment.cluster }}'
        namespace: '{{ .deployment.namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        # The peer listener accepts routes only from namespaces with this
        # label.
        managedNamespaceMetadata:
          labels:
            aigw-ui.io/serving: "true"
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
      # aigw-ui writes these on chart-owned routes (fleet contract).
      ignoreDifferences:
        - group: aigateway.envoyproxy.io
          kind: AIGatewayRoute
          jsonPointers:
            - /spec/llmRequestCosts
            - /metadata/annotations/gateway.envoyproxy.io~1aigw-ui-quota-revision
