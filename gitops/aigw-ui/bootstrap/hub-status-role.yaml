# Optional: lets aigw-ui show each deployment's Argo CD sync and health
# (hub setting ARGOCD_NAMESPACE). Read-only, Applications only. The subject
# is aigw-ui's ServiceAccount; change its namespace if the hub runs
# elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aigw-ui-applications-read
  namespace: openshift-gitops
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aigw-ui-applications-read
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aigw-ui-applications-read
subjects:
  - kind: ServiceAccount
    name: aigw-ui
    namespace: aigw-ui
