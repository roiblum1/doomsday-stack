# What an Application of a model may do: the kinds charts/model-deployer
# renders, never in the platform's or the gateway's namespaces (where
# aigw-ui's own objects are), only on clusters registered for this project
# (a cluster Secret with project: aigw-ui-models). Apply once to the Argo CD
# instance (openshift-gitops).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aigw-ui-models
  namespace: openshift-gitops
spec:
  description: Models deployed by charts/model-deployer from gitops/app-of-apps (lab)
  sourceRepos:
    - https://github.com/roiblum1/doomsday-stack.git
  permitOnlyProjectScopedClusters: true
  destinations:
    - {name: "*", namespace: "!envoy-ai-gateway-system"}
    - {name: "*", namespace: "!envoy-gateway-system"}
    - {name: "*", namespace: "!kserve"}
    - {name: "*", namespace: "!openshift*"}
    - {name: "*", namespace: "!kube-*"}
    - {name: "*", namespace: "!default"}
    - {name: "*", namespace: "*"}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: "", kind: PersistentVolume}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: security.openshift.io, kind: SecurityContextConstraints}
  namespaceResourceWhitelist:
    - {group: serving.kserve.io, kind: LLMInferenceService}
    - {group: llm-d.ai, kind: InferenceObjective}
    - {group: aigateway.envoyproxy.io, kind: AIGatewayRoute}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: gateway.envoyproxy.io, kind: BackendTrafficPolicy}
    - {group: lmcache.lmcache.ai, kind: LMCacheEngine}
    - {group: monitoring.coreos.com, kind: PrometheusRule}
    - {group: apps, kind: DaemonSet}
    - {group: batch, kind: Job}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: Secret}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
