# A serving cluster for aigw-ui's models. Its name must be the cluster's
# name in aigw-ui. project: aigw-ui-models scopes it to the AppProject,
# which accepts no other cluster. Do not commit the real one.
#
# On the serving cluster, an account for Argo CD:
#   oc create namespace aigw-argocd
#   oc -n aigw-argocd create serviceaccount argocd-manager
#   oc adm policy add-cluster-role-to-user cluster-admin -z argocd-manager -n aigw-argocd
#   oc -n aigw-argocd apply -f - <<'TOKEN'
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: argocd-manager-token
#     annotations: {kubernetes.io/service-account.name: argocd-manager}
#   type: kubernetes.io/service-account-token
#   TOKEN
#   oc -n aigw-argocd get secret argocd-manager-token -o jsonpath='{.data.token}' | base64 -d
#   oc -n aigw-argocd get secret argocd-manager-token -o jsonpath='{.data.ca\.crt}'
apiVersion: v1
kind: Secret
metadata:
  name: aigw-cluster-<name>
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: <name>
  server: https://api.<cluster domain>:6443
  project: aigw-ui-models
  config: |
    {"bearerToken": "<token>", "tlsClientConfig": {"caData": "<base64 ca.crt>"}}
