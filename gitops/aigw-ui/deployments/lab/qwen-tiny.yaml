# Written by aigw-ui (Deployments). Argo CD's ApplicationSet aigw-ui-models
# deploys it with charts/model-deployer. A change here is a change on the
# cluster; aigw-ui reads this file back, so edits by hand are kept.
deployment:
  cluster: lab
  namespace: vllm-lab
model:
  capacityPerInstance: "1"
  maxModelLen: 8192
  name: qwen-tiny
  revision: qwen2.5-0.5b-lab
  uri: hf://Qwen/Qwen2.5-0.5B-Instruct
peer:
  maxParallelRequests: 8
scheduler:
  flowControl:
    enabled: true
    maxConcurrency: 2
    negativeBandMaxRequests: 4
serving:
  args:
  - --enable-prompt-tokens-details
  - --enable-force-include-usage
  - --dtype=bfloat16
  env:
    VLLM_CPU_KVCACHE_SPACE: "4"
  image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.29.0
  replicas: 1
  resources:
    limits:
      cpu: "8"
      memory: 12Gi
    requests:
      cpu: "4"
      memory: 8Gi
storage:
  cache:
    size: 5Gi
  mode: cache
