                  export UCX_NET_DEVICES=${UCX_NET_DEVICES:-${hca_port_pairs_list}}

                  echo "[Infer RoCE] NCCL_IB_HCA=${NCCL_IB_HCA}"
                  echo "[Infer RoCE] NVSHMEM_HCA_LIST=${NVSHMEM_HCA_LIST}"
                  echo "[Infer RoCE] UCX_NET_DEVICES=${UCX_NET_DEVICES}"
