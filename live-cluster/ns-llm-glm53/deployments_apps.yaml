              nvidia.com/gpu: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /health
              port: 8208
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /cache
            name: compile-cache
          - mountPath: /dev/hugepages
            name: hugepages
          - mountPath: /home
            name: home
          - mountPath: /tmp
            name: tmp-dir
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /models
            name: model-cache
          - mountPath: /var/run/kserve/tls
            name: tls-certs
            readOnly: true
          - mountPath: /mnt/models
            name: kserve-pvc-source
            readOnly: true
            subPath: GLM-5.3-Flash-NVFP4
        dnsPolicy: ClusterFirst
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        restartPolicy: Always
        runtimeClassName: performance-gpu-hpc-performanceprofile-extras-b200
        schedulerName: default-scheduler
