            /s5cmd --endpoint-url "${ENDPOINT}" cp --concurrency 16 "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors" .
            /s5cmd --endpoint-url "${ENDPOINT}" cp "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model.safetensors.index.json" .
            /s5cmd --endpoint-url "${ENDPOINT}" cp "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors.index.json" .
            echo "--- verify-index against new main index"
            MISSING=$(grep -oE "\"[^\"]+\.safetensors\"" model.safetensors.index.json | tr -d "\"" | sort -u | while read -r f; do [ -f "$f" ] || echo "$f"; done)
            if [ -n "${MISSING}" ]; then echo "MISSING SHARDS:"; echo "${MISSING}" | head -40; exit 1; fi
            REFS=$(grep -oE "\"[^\"]+\.safetensors\"" model.safetensors.index.json | tr -d "\"" | sort -u | wc -l)
            echo "verify-index: all ${REFS} referenced shards present"
            touch .download-complete
            echo DONE
          command:
          - /bin/sh
          - -c
          env:
          - name: ENDPOINT
            value: http://host.example.internal
          - name: AWS_ACCESS_KEY_ID
            value: REDACTED-ENV
          - name: AWS_SECRET_ACCESS_KEY
            value: REDACTED-ENV
          image: registry-internal/tools/s5cmd:v2.3.0
