          controller-uid: 6373242d-dbba-47f9-9678-2f229013e166
          job-name: glm53-flash-bucket-repair
      spec:
        containers:
        - args:
          - |-
            set -euo pipefail
            cd /work
            echo "--- pulling delta from prod S3"
            AWS_ACCESS_KEY_ID=$PROD_KEY AWS_SECRET_ACCESS_KEY=$PROD_SECRET /s5cmd --endpoint-url "$PROD_ENDPOINT" cp --concurrency 16 "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors" .
            AWS_ACCESS_KEY_ID=$PROD_KEY AWS_SECRET_ACCESS_KEY=$PROD_SECRET /s5cmd --endpoint-url "$PROD_ENDPOINT" cp "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model.safetensors.index.json" .
            AWS_ACCESS_KEY_ID=$PROD_KEY AWS_SECRET_ACCESS_KEY=$PROD_SECRET /s5cmd --endpoint-url "$PROD_ENDPOINT" cp "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors.index.json" .
            ls -la
            echo "--- uploading to our bucket"
            AWS_ACCESS_KEY_ID=$OUR_KEY AWS_SECRET_ACCESS_KEY=$OUR_SECRET /s5cmd --endpoint-url "$OUR_ENDPOINT" cp model_mtp.safetensors "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors"
            AWS_ACCESS_KEY_ID=$OUR_KEY AWS_SECRET_ACCESS_KEY=$OUR_SECRET /s5cmd --endpoint-url "$OUR_ENDPOINT" cp model.safetensors.index.json "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model.safetensors.index.json"
            AWS_ACCESS_KEY_ID=$OUR_KEY AWS_SECRET_ACCESS_KEY=$OUR_SECRET /s5cmd --endpoint-url "$OUR_ENDPOINT" cp model_mtp.safetensors.index.json "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/model_mtp.safetensors.index.json"
            echo "--- verifying our bucket now"
            AWS_ACCESS_KEY_ID=$OUR_KEY AWS_SECRET_ACCESS_KEY=$OUR_SECRET /s5cmd --endpoint-url "$OUR_ENDPOINT" ls "s3://llms/RedHatAI/GLM-5.3-Flash-NVFP4/" | grep -iE "model_mtp|index.json"
            echo BUCKET-REPAIR-DONE
          command:
          - /bin/sh
          - -c
          env:
          - name: PROD_ENDPOINT
            value: http://host.example.internal
          - name: PROD_KEY
            value: REDACTED-ENV
          - name: PROD_SECRET
            value: REDACTED-ENV
          - name: OUR_ENDPOINT
            valueFrom:
              secretKeyRef:
                key: AWS_ENDPOINT_URL
                name: glm53-s3
          - name: OUR_KEY
            valueFrom:
              secretKeyRef:
                key: AWS_ACCESS_KEY_ID
                name: glm53-s3
          - name: OUR_SECRET
            valueFrom:
              secretKeyRef:
                key: AWS_SECRET_ACCESS_KEY
                name: glm53-s3
          image: registry-internal/tools/s5cmd:v2.3.0
          imagePullPolicy: IfNotPresent
          name: repair
          resources:
            limits:
              cpu: "8"
              memory: 8Gi
            requests:
              cpu: "4"
              memory: 4Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /work
            name: work
        dnsPolicy: ClusterFirst
        restartPolicy: Never
        schedulerName: default-scheduler
        securityContext: {}
        serviceAccount: s3sa
        serviceAccountName: s3sa
        terminationGracePeriodSeconds: 30
        volumes:
        - emptyDir:
            sizeLimit: 12Gi
          name: work
