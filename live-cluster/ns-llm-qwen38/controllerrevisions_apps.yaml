                ensure_vg
                ensure_lv llm-models 200G models
                ensure_lv llm-cache 150G cache
                ensure_lv llm-l2 1000G lmcache-l2
                seed_flashinfer_cubins
                echo "[node-prep] $(date -Is) OK: $(mount | grep ${BASE} | awk '{print $1"->"$3}' | tr '\n' ' ')"
                sleep ${LOOP}
              done
            command:
            - nsenter
            - -t
            - "1"
            - -m
            - -u
            - -i
            - -n
            - --
            - /bin/bash
            - -c
            image: registry-internal/vllm/vllm-openai:v0.30.0
            imagePullPolicy: IfNotPresent
            name: node-prep
            resources:
              limits:
                cpu: "2"
                memory: 1Gi
              requests:
                cpu: "1"
                memory: 512Mi
            securityContext:
              privileged: true
              runAsNonRoot: false
              runAsUser: 0
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          - args:
            - exec -a lmcache-cubin-src sleep infinity
            command:
            - /bin/bash
            - -c
            image: registry-internal/vllm/vllm-openai:v0.30.0
            imagePullPolicy: IfNotPresent
            name: cubin-src
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          hostPID: true
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-L4
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: qwen38-node-prep
          serviceAccountName: qwen38-node-prep
          terminationGracePeriodSeconds: 5
