            app: qwen38-node-prep
            app.kubernetes.io/instance: qwen38
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: qwen38
            helm.sh/chart: qwen38-bundled-0.2.6
        spec:
