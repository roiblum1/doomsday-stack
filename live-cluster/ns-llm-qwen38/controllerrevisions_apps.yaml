              # (fresh L4 node with a blank data disk). Safe by refusal:
              # pvcreate without --force rejects devices with filesystem or
              # partition signatures, and the script additionally skips any
              # disk lsblk reports as non-blank. Non-fatal on failure: the
              # loop below retries every ${LOOP}s.
