apiVersion: v1
items:
- apiVersion: apps/v1
  data:
    spec:
      template:
        $patch: replace
        metadata:
          labels:
            app.kubernetes.io/component: cache-engine
            app.kubernetes.io/instance: qwen38-cache
            app.kubernetes.io/managed-by: lmcache-operator
            app.kubernetes.io/name: lmcache
        spec:
          containers:
          - args:
            - --host
            - 0.0.0.0
            - --port
            - "5555"
            - --http-port
            - "8080"
            - --l1-size-gb
            - "200.0"
            - --chunk-size
            - "1600"
            - --max-workers
            - "1"
            - --hash-algorithm
            - blake3
            - --isolated-ipc
            - --eviction-policy
            - LRU
            - --eviction-trigger-watermark
            - "0.80"
            - --eviction-ratio
            - "0.20"
            - --prometheus-port
            - "8080"
            - --l2-adapter
            - '{"backend":"POSIX","backend_params":{"file_path":"/mnt/lmcache-l2","max_capacity_gb":"900","shard_dirs":"true","use_direct_io":"false"},"eviction":{"eviction_policy":"LRU","eviction_ratio":0.1,"trigger_watermark":0.9},"persist_enabled":true,"type":"nixl_store_dynamic"}'
            - --l2-store-policy
            - default
            - --l2-prefetch-policy
            - default
            - --l2-prefetch-max-in-flight
            - "8"
            command:
            - /opt/venv/bin/lmcache
            - server
            env:
            - name: LMCACHE_LOG_LEVEL
              value: INFO
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: HOME
              value: /tmp
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba
            image: registry-internal/lmcache/lmcache/vllm-openai:v0.5.5
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              periodSeconds: 10
              successThreshold: 1
              tcpSocket:
                port: 5555
              timeoutSeconds: 1
            name: lmcache
            ports:
            - containerPort: 5555
              name: server
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              periodSeconds: 5
              successThreshold: 1
              tcpSocket:
                port: 5555
              timeoutSeconds: 1
            resources:
              limits:
                memory: 308Gi
              requests:
                cpu: "4"
                memory: 205Gi
            securityContext:
              privileged: false
            startupProbe:
              failureThreshold: 40
              initialDelaySeconds: 5
              periodSeconds: 5
              successThreshold: 1
              tcpSocket:
                port: 5555
              timeoutSeconds: 1
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /mnt/lmcache-l2
              name: l2
          dnsPolicy: ClusterFirst
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-L4
          priorityClassName: openshift-user-critical
          restartPolicy: Always
          runtimeClassName: nvidia
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: qwen38-cache
          serviceAccountName: qwen38-cache
          terminationGracePeriodSeconds: 30
          volumes:
          - name: l2
            persistentVolumeClaim:
              claimName: qwen38-cache-l2
