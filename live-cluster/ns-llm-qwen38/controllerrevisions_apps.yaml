                    # the disk itself; strip ALL whitespace so only real
                    # partition/filesystem signatures match)
                    echo "[node-prep] REFUSING to use ${dev}: has partitions/filesystem (not blank)"
                    return 0
                  else
                    echo "[node-prep] pvcreate ${dev}"
                    pvcreate --yes "${dev}" || return 0
                  fi
                  devs+=("${dev}")
                done
