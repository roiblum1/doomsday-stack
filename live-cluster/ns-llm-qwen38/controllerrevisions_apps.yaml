                    echo "[node-prep] pvcreate ${dev}"
                    pvcreate --yes "${dev}" || return 0
                  fi
                  devs+=("${dev}")
                done
                if [ ${#devs[@]} -eq 0 ]; then
                  return 0
                fi
                vgcreate --yes "${VG}" "${devs[@]}" || return 0
                echo "[node-prep] created ${VG}"
              }

              # Ensure an LV exists, is mounted, and -- critically -- is
              # mounted at BOTH path resolutions the container runtime may
              # use for local PVs. On RHCOS /var is a bind of
              # <rootfs>/ostree/deploy/rhcos/var, so the same directory is
              # reachable via /var/mnt/... AND via the ostree path. Bind
              # mounts are snapshots: if the runtime binds through the
              # ostree path while the LV is only mounted at the /var path
              # (or vice versa), the pod gets the underlying boot-disk
              # directory and silently writes cache data to the root fs.
              # Mounting the LV at both paths makes every resolution land
              # on the LV. fstab entries make systemd mount both at boot,
              # before the kubelet starts pods (same protection across
              # node reboots).
              ensure_fstab() {
                local dev=$1 mp=$2
                if ! grep -qE "^${dev}[[:space:]]+${mp}[[:space:]]" /etc/fstab; then
                  echo "${dev}  ${mp}  xfs  defaults,nofail,x-systemd.device-timeout=10s  0 0" >> /etc/fstab
                  echo "[node-prep] fstab entry added: ${dev} -> ${mp}"
                fi
              }
              ensure_lv() {
                local name=$1 size=$2 subdir=$3
                local dev="/dev/${VG}/${name}" mp="${BASE}/${subdir}"
                if ! lvs "${VG}/${name}" >/dev/null 2>&1; then
                  echo "[node-prep] creating LV ${VG}/${name} (${size})"
                  # Non-fatal on failure (e.g. vg1 briefly out of space while
                  # an old volume is being recycled): the loop below retries
                  # every ${LOOP}s instead of crash-looping the pod.
                  if ! lvcreate -y -L "${size}" -n "${name}" "${VG}"; then
                    echo "[node-prep] lvcreate ${name} deferred (will retry): $(vgs --noheadings -o vg_free --units g ${VG} 2>/dev/null || echo '?') free"
                    return 0
                  fi
                fi
                lvchange -ay "${VG}/${name}" 2>/dev/null || true
                mkdir -p "${mp}"
                if ! mountpoint -q "${mp}"; then
                  if ! blkid "${dev}" >/dev/null 2>&1; then
                    echo "[node-prep] mkfs.xfs ${dev}"
                    mkfs.xfs "${dev}"
                  fi
                  mount "${dev}" "${mp}"
                  # Full relabel once, right after first mount (empty fs).
                  chcon -R -t container_file_t ${BASE}
                fi
                ensure_fstab "${dev}" "${mp}"
                # Second mount at the canonical (root-mount) path: same
                # directory content, independent mount instance. Harmless
                # when /var is not a bind (canon == mp, skipped).
                local var_root canon=""
                var_root="$(findmnt -n -o FSROOT /var 2>/dev/null || true)"
                case "${BASE}" in
                  /var/*) [ -n "${var_root}" ] && [ "${var_root}" != "/" ] && canon="${var_root}${BASE#/var}/${subdir}" ;;
                esac
                if [ -n "${canon}" ] && [ "${canon}" != "${mp}" ]; then
                  mkdir -p "${canon}" 2>/dev/null || true
                  if ! mountpoint -q "${canon}"; then
                    if mount "${dev}" "${canon}" 2>/dev/null; then
                      echo "[node-prep] dual mount OK: ${name} also at ${canon}"
                    else
                      echo "[node-prep] WARN: dual mount failed: ${name} -> ${canon} (will retry)"
                    fi
                  fi
                  ensure_fstab "${dev}" "${canon}"
                fi
                chmod 1777 "${mp}"
                chcon -t container_file_t "${mp}" >/dev/null 2>&1 || true
              }

              # (flashinfer cubin seeding needs the image's dist-packages,
              # which are NOT visible in this HOST mount namespace; the
              # cubin-src container below exposes them via /proc/<pid>/root.)

              # Seed flashinfer's trtllm-gen cubins from the cubin-src
              # container's rootfs (same image, v0.30.0: flashinfer
              # 0.6.18.post1 bundles the cubins) into the cache LV. The
              # lmcache vllm-openai:v0.5.5 image ships plain flashinfer
              # 0.6.18 with NO bundled cubins and fetches fmha/trtllm-gen
              # cubins from edge.urm.nvidia.com at boot -- unreachable
              # air-gapped (vLLM pod crash-looped on "Failed to get
              # checksums.txt"). flashinfer checks FLASHINFER_CUBIN_DIR (=
              # FLASHINFER_WORKSPACE_BASE + .cache/flashinfer/cubins inside
              # the vLLM pods, i.e. this LV) BEFORE any download and
              # sha256-verifies each file, so a plain copy satisfies it.
              # Runs AFTER ensure_lv mounted the LV (we see it through the
              # host mount table, so no bind-mount staleness). Idempotent.
              # NOTE: the cubin package is arch-tagged; if the L4 (sm89)
              # cubins the serving image needs are absent from this package,
              # seeding is a no-op for them and any boot failure must be
              # handled by pinning a donor image that bundles sm89 cubins.
              seed_flashinfer_cubins() {
                # ONLY seed onto the mounted cache LV: without this check
                # a deferred lvcreate would silently write ~6G of cubins to
                # the boot disk (later shadowed by the LV mount, invisible
                # and undeletable through normal paths).
                if ! mountpoint -q "${BASE}/cache"; then
                  echo "[node-prep] cache LV not mounted yet, cubin seeding deferred"
                  return 0
                fi
                local dst_root="${BASE}/cache/flashinfer/.cache/flashinfer/cubins"
                local pid
                # Anchored: this script's own cmdline contains the marker
                # text (function body), and pgrep -f scans full cmdlines --
                # an unanchored pattern matched ourselves (host root, no
                # dist-packages). ^ pins it to the sidecar's argv0.
                pid=$(pgrep -f '^lmcache-cubin-src' | head -1 || true)
                if [ -z "${pid}" ]; then
                  echo "[node-prep] cubin-src container not up yet, will retry"
                  return 0
                fi
                local src="/proc/${pid}/root/usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins"
                if [ ! -d "${src}" ]; then
                  echo "[node-prep] cubin-src image has no flashinfer_cubin package"
                  return 0
                fi
                for hashdir in "${src}"/*; do
                  [ -d "${hashdir}" ] || continue
                  local hash=$(basename "${hashdir}")
                  if [ -e "${dst_root}/${hash}/fmha/trtllm-gen/checksums.txt" ]; then
                    continue
                  fi
                  echo "[node-prep] seeding flashinfer cubins ${hash} ($(du -sh ${hashdir} | cut -f1))"
                  mkdir -p "${dst_root}/${hash}"
                  cp -a "${hashdir}/." "${dst_root}/${hash}/"
                  chmod -R a+rX "${dst_root}/${hash}"
                  echo "[node-prep] seeded ${hash}"
                done
              }

              while true; do
                ensure_vg
                ensure_lv llm-models 200G models
                ensure_lv llm-cache 150G cache
                ensure_lv llm-l2 1000G lmcache-l2
                seed_flashinfer_cubins
                echo "[node-prep] $(date -Is) OK: $(mount | grep ${BASE} | awk '{print $1"->"$3}' | tr '\n' ' ')"
                sleep ${LOOP}
              done
            command:
            - nsenter
            - -t
            - "1"
            - -m
            - -u
            - -i
            - -n
            - --
            - /bin/bash
            - -c
            image: registry-internal/vllm/vllm-openai:v0.30.0
            imagePullPolicy: IfNotPresent
            name: node-prep
            resources:
              limits:
                cpu: "2"
                memory: 1Gi
              requests:
                cpu: "1"
                memory: 512Mi
            securityContext:
              privileged: true
              runAsNonRoot: false
              runAsUser: 0
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          - args:
            - exec -a lmcache-cubin-src sleep infinity
            command:
            - /bin/bash
            - -c
            image: registry-internal/vllm/vllm-openai:v0.30.0
            imagePullPolicy: IfNotPresent
            name: cubin-src
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          hostPID: true
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-L4
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: qwen38-node-prep
          serviceAccountName: qwen38-node-prep
          terminationGracePeriodSeconds: 5
