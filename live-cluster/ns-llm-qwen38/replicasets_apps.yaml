                KV_TRANSFER_ARGS=""
              fi
            fi

            eval "exec vllm serve /mnt/models \
              --served-model-name "Qwen3.8-27B-FP8" "publishers/llm-qwen38/models/Qwen3.8-27B-FP8" \
              --port 8000 \
              ${ACCESS_LOG_ARGS} \
